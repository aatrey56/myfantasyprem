# Postgres 16 for one small VM (Oracle A1, 2 OCPU / 12 GB), with the
# postgres container capped at 4 GB (compose.prod.yml). About a dozen users:
# the working set fits in shared_buffers many times over. Values follow
# PGTune's "web application" profile, trimmed.

listen_addresses = '*'          # only the compose network can reach it; no port is published
port = 5432
max_connections = 50            # the API's pgx pool + admin/migrate + backups
password_encryption = scram-sha-256

# Memory (container limit 4 GB)
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
huge_pages = off

# Writes and checkpoints
wal_level = replica
min_wal_size = 256MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
synchronous_commit = on         # never trade durability here

# Planner: Oracle block volumes behave like SSDs
random_page_cost = 1.1
effective_io_concurrency = 100
default_statistics_target = 100

# Parallelism (2 OCPUs)
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# Housekeeping
autovacuum = on
idle_in_transaction_session_timeout = 5min
timezone = 'UTC'
log_timezone = 'UTC'

# Logging to stderr (Docker rotates it)
log_destination = 'stderr'
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '
