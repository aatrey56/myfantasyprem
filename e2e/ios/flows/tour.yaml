- waitForAnimationToEnd
- takeScreenshot: ios-tour-scores
- openLink: ${APP_SCHEME}://feed
- extendedWaitUntil:
    visible: { id: 'feed-league' }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ios-tour-feed
- openLink: ${APP_SCHEME}://account
- extendedWaitUntil:
    visible: 'Account'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ios-tour-account
- scroll
- waitForAnimationToEnd
- takeScreenshot: ios-tour-account-scrolled
