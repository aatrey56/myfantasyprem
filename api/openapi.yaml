  /v1/leagues/{leagueId}/gameweeks/{gw}/projections:
    get:
      operationId: getLeagueProjections
      tags: [leagues]
      summary: Expected points and win odds for a gameweek
      description: |
        Expected points for every rostered player and each team's XI, and
        win odds for every matchup of the gameweek (ADR 0014). Nothing is
        a forecast model:

        - A player's `expected` is his form (as `PlayerListItem.form`, for
          the gameweek or the season's form gameweek if earlier) times the
          fixture factor of each of his matches in the gameweek: 0.8 for
          the hardest opponent (difficulty rank 1) to 1.2 for the easiest
          (20), 0.8 + 0.4 × (rank − 1) / 19, and 1 for an unranked one. A
          blank gameweek is 0, a double sums both. One decimal.
        - A team's `expected` is the sum of its starting XI's, with no
          auto-subs applied. Before the deadline another team's XI is not
          public, so it is taken from its last locked lineup
          (`lineupBasis: last_locked`), as `GET /teams/{teamId}` orders it.
        - Win odds resample real scores: in each of 10,000 plays every
          starter scores his points so far plus, for each of his matches
          not yet kicked off, one of his own gameweek totals from
          `recentGameweeks` drawn at random. Before kickoff that is the
          whole XI; live, only the players yet to play. Once every match
          of the gameweek is over the odds are the result. The plays are
          seeded by matchup, gameweek and five-minute bucket (one bucket
          before kickoff), so the odds do not flicker. Null when no
          gameweek is completed yet.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/GameweekParam'
      responses:
        '200':
          description: The gameweek's projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueProjectionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/start-sit:
    get:
      operationId: getStartSitAccuracy
      tags: [leagues]
      summary: Start/sit accuracy per team
      description: |
        For every team and every completed gameweek it played: its points
        (as scored, auto-subs included) as a share of its optimal XI's,
        the best legal XI from its 15 by actual points (1 GKP, 3-5 DEF,
        2-5 MID, 1-3 FWD). `seasonAccuracy` is the mean of the gameweeks'
        accuracies. Teams by `seasonAccuracy`, best first (null last).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      responses:
        '200':
          description: Start/sit accuracy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  # ------------------------------------------------ end projections
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      tags: [auth]
      security: []
      summary: Sign in with Apple
      description: |
        Exchanges an Apple identity token (and the one-time authorization code,
        which the server keeps so it can revoke the Apple token when the account
        is deleted) for a session. Creates the user on first sign-in
        (`isNewUser`). Apple sends the name only on the first sign-in, so pass
        `givenName`/`familyName` then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      security: []
      summary: Sign in with Google
      description: |
        Exchanges a Google ID token for a session. Creates the user on first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email:
    post:
      operationId: startEmailSignIn
      tags: [auth]
      security: []
      summary: Email a magic sign-in link
      description: |
        Sends a single-use sign-in link and a 6-digit code to the address.
        Always answers 202, whether or not an account exists, so the
        endpoint cannot be used to discover accounts. The link carries a
        token for `POST /v1/auth/email/verify` (and `next`, when sent); the
        code is for `POST /v1/auth/email/code`. Either one signs in, once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSignInRequest'
      responses:
        '202':
          description: Link sent if the address can receive it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSignInStartedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailSignIn
      tags: [auth]
      security: []
      summary: Finish an email sign-in
      description: |
        Exchanges the magic-link token for a session. Tokens are single use and expire after 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/code:
    post:
      operationId: verifyEmailSignInCode
      tags: [auth]
      security: []
      summary: Finish an email sign-in with its code
      description: |
        Exchanges the 6-digit code from the latest sign-in email to the
        address for a session. The code and the email's link are one
        sign-in: whichever is used first, the other stops working, and both
        expire after 15 minutes. Five wrong codes end the sign-in (its link
        too). Each address may send 10 wrong codes per 24 hours; after
        that the endpoint answers 429 (with `Retry-After`) without checking
        the code, until the oldest wrong code is 24 hours old. A code of an
        older email to the same address is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerifyRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/claim:
    post:
      operationId: claimSeatSignIn
      tags: [auth]
      security: []
      summary: Claim a seat with its claim link and sign in
      description: |
        For the testing phase (docs/adr/0013): a signed-out person who opens
        an imported league's seat claim link enters only a display name. The
        server creates an account without an email, gives it the link's seat
        and signs it in, in one transaction: either all of it happens or
        nothing does. The response is a normal session (`isNewUser` true)
        plus the membership. A signed-in person claims with their own
        account through `POST /v1/invites/{code}/accept` instead.

        Only claim links work here. The claim code is a credential: send it
        in the body (never in a URL the server logs). Errors: 401
        `claim-sign-in-off` when the server has `CLAIM_LINK_SIGNIN` off, and
        `sign-in-required` for an ordinary invite (those need an account);
        404 for an unknown code; 409 `seat-claimed` when the link was already
        used; 410 `invite-expired` when the commissioner issued a newer link
        for the seat; 422 for a missing or too long display name. Limited
        per client IP with the other `/v1/auth/*` routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSignInRequest'
      responses:
        '200':
          description: The seat is claimed and the new account is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSignInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signin-link:
    post:
      operationId: signInWithLink
      tags: [auth]
      security: []
      summary: Sign in with a commissioner-issued sign-in link
      description: |
        docs/adr/0013 ("Sign-in links"): the commissioner of an imported
        league can issue a sign-in link for a claimed seat's manager, who
        has no other way back in after signing out (an account made by a
        claim link has no email). Opening it starts a new session for that
        account on any device. The link works once and for 7 days; a newer
        link for the same account replaces it. The code is a credential:
        send it in the body. The response carries the league the link was
        issued in, to land on. 401 when the link is unknown, used, replaced
        or expired. Limited per client IP with the other `/v1/auth/*` routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInLinkRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLinkSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      security: []
      summary: Refresh a session
      description: |
        Rotates the refresh token and returns a new access token. A refresh
        token is single use: reusing an old one revokes the whole session
        (theft detection).
      requestBody:
        required: true
        content:
          application/json:
