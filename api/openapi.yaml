  /v1/leagues/{leagueId}/free-agent-moves:
    post:
      operationId: addFreeAgent
      tags: [waivers]
      summary: Add a free agent
      description: |
        First come, first served once waivers have run, until the gameweek
        deadline. Drops a player of the same position (422 `position-mismatch`).
        409 `player-on-waivers`, `player-taken` or `player-locked` (a player
        added or dropped is locked until the next waiver run),
        `player-in-trade-review`, or `player-in-trade` (the drop is in a trade
        accepted after the trade deadline, which counts from the next
        gameweek; until then neither team can move its players).
        409 `transactions-locked` from the gameweek deadline until the
        gameweek is finished; `reopensAt` is the next waiver run.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeAgentMoveRequest'
      responses:
        '201':
          description: Done.
          headers:
            Location:
              description: Path of the created resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeAgentMoveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: Trades
      description: |
        Newest first. Offers between two other teams are visible to the league
        only once accepted (in review or decided); before that only the two
        teams see them.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - name: status
          in: query
          description: 'Filter. `open` = offered, accepted or in_review.'
          schema:
            type: string
            enum:
              [
                open,
                offered,
                accepted,
                in_review,
                processed,
                declined,
                withdrawn,
                expired,
                vetoed,
                failed,
              ]
        - name: teamId
          in: query
          description: Trades this team offered or received.
          schema:
            $ref: '#/components/schemas/TeamId'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of trades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: proposeTrade
      tags: [trades]
      summary: Offer a trade
      description: |
        Offers players from the caller's team for players on another team.
        Both sides must move the same number of players with the same positions
        (422 `trade-shape`), so both squads stay 2/5/5/3. 409 `trade-deadline`
        after the league's trade deadline, `player-in-trade-review`,
        `player-in-trade` (a player is in a processed trade that counts from
        the next gameweek). Unanswered
        offers expire at the next waiver run.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCreate'
      responses:
        '201':
          description: Offered.
          headers:
            Location:
              description: Path of the created resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: One trade
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}/accept:
    post:
      operationId: acceptTrade
      tags: [trades]
      summary: Accept a trade (receiving team)
      description: |
        Receiving team only. With no review the trade processes at once
        (`processed`); otherwise it goes `in_review` until `review.endsAt`.
        Accepting cancels other open offers involving the same players.
        409 `trade-not-open`, `trade-expired` (at or after `expiresAt`),
        `player-no-longer-available`,
        `player-in-trade-review`, `player-in-trade`.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}/decline:
    post:
      operationId: declineTrade
      tags: [trades]
      summary: Decline a trade (receiving team)
      description: |
        Receiving team only. 409 `trade-not-open`, `trade-expired`.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}/withdraw:
    post:
      operationId: withdrawTrade
      tags: [trades]
      summary: Withdraw a trade (offering team)
      description: |
        Offering team only, while `offered`. 409 `trade-not-open`,
        `trade-expired`.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}/votes:
    post:
      operationId: voteOnTrade
      tags: [trades]
      summary: Vote to veto or allow (league vote)
      description: |
        Leagues with `trades.review: league_vote`. Managers not in the trade
        vote while it is `in_review`; a vote can be changed until the window
        closes. The trade is vetoed when veto votes reach
        `review.votesNeeded`, otherwise it processes at `review.endsAt`.
        409 `trade-not-in-review`, `trade-review-closed` (at or after
        `review.endsAt`); 403 for the two teams in the trade.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeVoteRequest'
      responses:
        '200':
          description: The trade with updated counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/trades/{tradeId}/review:
    post:
      operationId: reviewTrade
      tags: [trades]
      summary: Approve or veto (commissioner)
      description: |
        Commissioner only, while `in_review`. In `commissioner` review mode the
        trade waits for this decision (it is approved automatically at
        `review.endsAt`); in `league_vote` mode the commissioner can still veto
        or approve early. A commissioner whose team is in the trade cannot
        review it (403 `own-trade`): in `commissioner` mode it is approved at
        `review.endsAt`, in `league_vote` mode the vote decides. 409
        `trade-not-in-review`, `trade-review-closed` (at or after
        `review.endsAt`), `pending-on-fpl` (a trade FPL accepted and has
        not processed or vetoed yet, `review.endsAt` null: FPL decides it).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TradeIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeReviewRequest'
      responses:
        '200':
          description: The decided trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      tags: [realtime]
      summary: Get a WebSocket ticket
      description: |
        Browsers cannot set an Authorization header on a WebSocket, so the
        client trades its bearer token for a single-use ticket valid for 60
        seconds and connects to `url` (`wss://.../v1/realtime?ticket=...`).
        Event schemas: `RealtimeEvent`; see docs/realtime.md.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketRequest'
      responses:
        '201':
          description: A ticket.
          headers:
            Location:
              description: Path of the created resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        The `accessToken` of a session from `/v1/auth/*`. Short lived (1 hour);
        refresh with `POST /v1/auth/refresh`.
  parameters:
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        Optional. A client-generated unique key (a UUID is fine) that makes
        a retry of this POST safe: the same key and body within 24 hours
        replay the first response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
    FixtureIdParam:
      name: fixtureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FixtureId'
    InviteIdParam:
      name: inviteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InviteId'
    InviteCodeParam:
      name: code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InviteCode'
    WaiverClaimIdParam:
      name: claimId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WaiverClaimId'
    TradeIdParam:
      name: tradeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TradeId'
    ImportIdParam:
      name: importId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportId'
    LeagueIdParam:
      name: leagueId
      in: path
      required: true
      description: Our opaque league id (not the FPL league id).
      schema:
        $ref: '#/components/schemas/LeagueId'
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TeamId'
    MatchupIdParam:
      name: matchupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MatchupId'
    GameweekParam:
      name: gw
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GameweekNumber'
    PlayerIdParam:
      name: playerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlayerId'
    ClubCodeParam:
      name: clubCode
      in: path
      required: true
      description: The club's short code (`ClubRef.code`), for example `ARS`.
      schema:
        type: string
        pattern: '^[A-Za-z]{2,4}$'
    IfNoneMatchParam:
      name: If-None-Match
      in: header
      description: An `ETag` from an earlier response; a match answers 304.
      schema:
        type: string
        maxLength: 256
    CursorParam:
      name: cursor
      in: query
      description: Opaque cursor from `meta.nextCursor` of the previous page.
      schema:
        type: string
        maxLength: 256
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Image:
      description: |
        The image (PNG, JPEG, WebP or GIF), cacheable for a week.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
        ETag:
          required: true
          schema:
            type: string
      content:
        image/*:
          schema:
            type: string
            format: binary
    NotModified:
      description: The client's copy (`If-None-Match`) is current.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
        ETag:
          required: true
          schema:
            type: string
    Unauthorized:
      description: |
        No bearer token, or it is malformed, expired or revoked. Comes with
        `WWW-Authenticate: Bearer`. For sign-in operations: the identity
        token or magic link was not accepted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Sign in to continue.
    Forbidden:
      description: |
        Signed in but not allowed: not a member of the league, not the
        commissioner, not the team owner, or the resource is private (for
        example another team's lineup before the deadline).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/not-commissioner
            title: Commissioner only
            status: 403
            detail: Only the commissioner can change league settings.
    Conflict:
      description: |
        The request clashes with the current state. The problem `type` slug
        says which, for example `not-your-turn`, `player-taken`,
        `lineup-locked`, `league-full`, `trade-not-open` or `setting-locked`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/not-your-turn
            title: Not your turn
            status: 409
            detail: Sunday League Heroes is on the clock.
    Gone:
      description: The invite expired or was revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Unexpected error, including 501 for operations not implemented yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request was malformed (bad parameter, body or id format).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/bad-request
            title: Bad request
            status: 400
            detail: 'limit must be between 1 and 100.'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/not-found
            title: Not found
            status: 404
            detail: League not found.
    Unprocessable:
      description: |
        The request was well formed but breaks a rule, for example an
        illegal lineup (`invalid-lineup`), a trade with unmatched positions
        (`trade-shape`), a reused idempotency key, or a classic FPL league
        link for the import (`classic-league-url`). Rule
        violations are listed in the problem's `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/classic-league-url
            title: Classic FPL league link
            status: 422
            detail: >-
              That link is for a classic FPL league (fantasy.premierleague.com).
              Paste your league link from draft.premierleague.com instead.
    TooManyRequests:
      description: |
        Rate limited (problem type `rate-limited`). Wait `Retry-After`
        seconds before retrying.
      headers:
        Retry-After:
          description: Seconds until a request will be accepted again.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Slow down and try again in 3 seconds.
    InternalError:
      description: The server failed. The detail is generic; quote `requestId`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://myfantasyprem.example/problems/internal
            title: Internal server error
            status: 500
            detail: Something went wrong on our side.
            requestId: 01k7m2xq8rfv3c9a4t6wbn5hdy
    UpstreamError:
      description: FPL returned an error or could not be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: The service is temporarily unavailable (starting up, overloaded or in maintenance).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # ---------------------------------------------------------------- common
    AppConfig:
      description: Client settings.
      type: object
      required: [brandedAssets]
      properties:
        brandedAssets:
          type: boolean
          description: |
            Whether `/v1/assets/*` serves official crests, shirts and player
            photos (the server's BRANDED_ASSETS). A build may still turn
            them off for itself (EXPO_PUBLIC_BRANDED_ASSETS=false).
        webPushPublicKey:
          type: [string, 'null']
          description: |
            The server's VAPID public key (base64url, uncompressed P-256) for
            PushManager.subscribe; null when Web Push is not configured.
      example:
        brandedAssets: true
    AppConfigResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AppConfig'
        meta:
          $ref: '#/components/schemas/Meta'
    Health:
      type: object
      required: [status]
      properties:
        status:
          description: Open enum.
          type: string
          enum: [ok, unavailable]
        version:
          type: string
      example:
        status: ok
        version: 0.2.0
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header.
        errors:
          type: array
          description: On 422, every rule the request broke.
          items:
            $ref: '#/components/schemas/ProblemError'
        leagueId:
          $ref: '#/components/schemas/LeagueId'
          description: |
            On 409 `already-member`: the league the caller is already in,
            so a client can open it directly.
        reopensAt:
          type: string
          format: date-time
          description: |
            On 409 `transactions-locked`: when free-agent signings reopen
            (the next gameweek's waiver run), if known.
      additionalProperties: true
      example:
        type: https://myfantasyprem.example/problems/not-implemented
        title: Not implemented
        status: 501
        detail: This endpoint is a stub.
    ScoreState:
      description: |
        Open enum. `upcoming`: no match has kicked off. `live`: matches in
        progress. `provisional`: matches done, bonus not yet added.
        `official`: bonus added. `final`: the stats feed has checked the
        data. From `provisional` on the result counts in the standings, with
        provisional bonus; a later bonus or stats change rescores it.
      type: string
      enum: [upcoming, live, provisional, official, final]
    Meta:
      type: object
      required: [dataAsOf, serverTime, stale]
      properties:
        dataAsOf:
          type: string
          format: date-time
          description: |
            How current the data is. Stats-derived data (scores, matchups,
            lineups with points, players): while a match is live, the last
            good poll of the stats feed; between matches, while the poller
            keeps its schedule (no failed poll and the next poll not overdue
            by 3 minutes), the server time, because nothing upstream moves;
            while the poller fails or has stopped, the last good poll. League
            state (drafts, claims, trades, settings): the server time.
        serverTime:
          type: string
          format: date-time
          description: |
            The server clock when this response was built. Age `dataAsOf`
            against this, not the device clock.
        stale:
          type: boolean
          description: |
            True when stats-derived data may be behind: a live match's data
            3 minutes after the last good poll, otherwise when the poller is
            failing or more than 3 minutes past its scheduled poll.
        staleAt:
          type: string
          format: date-time
          description: |
            Stats-derived data only: when this data turns stale unless a
            newer poll lands, on the server clock. The poller's next
            scheduled poll plus 3 minutes (while a match is live, the last
            good poll plus 3 minutes), so between match days, when the
            poller sleeps for hours, a client keeps the data fresh until
            then. Absent for league state, which never goes stale upstream.
        scoreState:
          $ref: '#/components/schemas/ScoreState'
      example:
        dataAsOf: '2026-10-17T14:02:31Z'
        serverTime: '2026-10-17T14:02:43Z'
        stale: false
        scoreState: live
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [nextCursor]
          properties:
            nextCursor:
              type: [string, 'null']
              description: Null on the last page.
    # ---------------------------------------------------------------- ids
    LeagueId:
      description: Opaque league id. `lg_` and a lowercase ULID.
      type: string
      pattern: '^lg_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['lg_01k7m2xq8rfv3c9a4t6wbn5hdy']
    TeamId:
      description: Opaque team id. `tm_` and a lowercase ULID.
      type: string
      pattern: '^tm_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['tm_01k7m2xq8s0000000000000003']
    MatchupId:
      description: Opaque matchup id. `mu_` and a lowercase ULID.
      type: string
      pattern: '^mu_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['mu_01k7m2xq8t0000000000000072']
    PlayerId:
      description: |
        Opaque player id. `plr_` and a lowercase ULID. Stable across seasons
        and providers; never FPL's `code` or per-season element id.
      type: string
      pattern: '^plr_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['plr_01k7m2xq8v00000000000000a1']
    FixtureId:
      description: Opaque fixture id. `fx_` and a lowercase ULID.
      type: string
      pattern: '^fx_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['fx_01k7m2xq8w0000000000000046']
    TransactionId:
      description: Opaque transaction id. `txn_` and a lowercase ULID.
      type: string
      pattern: '^txn_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['txn_01k7m2xq8x00000000000003e8']
    UserId:
      description: Opaque user id. `usr_` and a lowercase ULID.
      type: string
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['usr_01k7m2xq8z0000000000000001']
    DraftId:
      description: Opaque draft id. `drf_` and a lowercase ULID.
      type: string
      pattern: '^drf_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['drf_01k7m2xq800000000000000001']
    DraftPickId:
      description: Opaque draft pick id. `pk_` and a lowercase ULID.
      type: string
      pattern: '^pk_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['pk_01k7m2xq800000000000000101']
    WaiverClaimId:
      description: Opaque waiver claim id. `wv_` and a lowercase ULID.
      type: string
      pattern: '^wv_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['wv_01k7m2xq800000000000000201']
    TradeId:
      description: Opaque trade id. `trd_` and a lowercase ULID.
      type: string
      pattern: '^trd_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['trd_01k7m2xq800000000000000301']
    InviteId:
      description: Opaque invite id. `inv_` and a lowercase ULID.
      type: string
      pattern: '^inv_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['inv_01k7m2xq800000000000000401']
    InviteCode:
      description: |
        The short code in an invite link: 10 characters of an alphabet
        with no look-alikes (no 0, O, 1, I, L or U). Codes made before
        codes grew have 8 characters and keep working until they expire.
        Case-insensitive on input; always returned upper case.
      type: string
      pattern: '^[2-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{8}([2-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{2})?$'
      examples: ['K7QM2XRP4D']
    ImportId:
      description: Opaque import job id. `imp_` and a lowercase ULID.
      type: string
      pattern: '^imp_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['imp_01k7m2xq8y0000000000000001']
    FplLeagueId:
      description: FPL Draft's numeric league id. An attribute, never a public id.
      type: integer
      format: int64
      minimum: 1
      examples: [12345]
    GameweekNumber:
      type: integer
      minimum: 1
      maximum: 38
    Season:
      description: Season label, for example `2026-27`.
      type: string
      pattern: '^\d{4}-\d{2}$'
      examples: ['2026-27']
    Position:
      description: Open enum.
      type: string
      enum: [GKP, DEF, MID, FWD]
    # ---------------------------------------------------------------- refs
    ClubRef:
      description: A Premier League club. Its crest and shirts are under `/v1/assets/clubs/{code}`.
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 4
          description: Short club code.
        name:
          type: string
      example:
        code: NOR
        name: Northgate
    PlayerAvailability:
      description: Open enum.
      type: string
      enum: [available, doubtful, injured, suspended, unavailable]
    PlayerRef:
      description: Enough to render a player row. The photo is `/v1/assets/players/{id}/photo`.
      type: object
      required: [id, displayName, club, position, availability]
      properties:
        id:
          $ref: '#/components/schemas/PlayerId'
        displayName:
          type: string
        club:
          $ref: '#/components/schemas/ClubRef'
        position:
          $ref: '#/components/schemas/Position'
        availability:
          $ref: '#/components/schemas/PlayerAvailability'
        news:
          type: [string, 'null']
          description: Short injury or availability note.
        newsAt:
          type: [string, 'null']
          format: date-time
          description: When the source added `news`; null or absent when it gives no time.
      example:
        id: plr_01k7m2xq8v00000000000000a1
        displayName: R. Calder
        club: { code: NOR, name: Northgate }
        position: MID
        availability: available
        news: null
    TeamRef:
      description: A real team in the league. Never the league-average pseudo-team.
      type: object
      required: [id, name, managerName]
      properties:
        id:
          $ref: '#/components/schemas/TeamId'
        name:
          type: string
        managerName:
          type: string
      example:
        id: tm_01k7m2xq8s0000000000000003
        name: Sunday League Heroes
        managerName: Sam P.
    TeamOpponent:
      type: object
      required: [kind, team]
      properties:
        kind:
          type: string
          const: team
        team:
          $ref: '#/components/schemas/TeamRef'
    AverageOpponentRef:
      description: The league-average opponent, without a score.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: average
    Opponent:
      description: A head-to-head opponent. Discriminated on `kind`.
      oneOf:
        - $ref: '#/components/schemas/TeamOpponent'
        - $ref: '#/components/schemas/AverageOpponentRef'
      discriminator:
        propertyName: kind
        mapping:
          team: '#/components/schemas/TeamOpponent'
          average: '#/components/schemas/AverageOpponentRef'
    # ---------------------------------------------------------------- gameweeks
    Gameweek:
      type: object
      required:
        - number
        - name
        - deadlineAt
        - waiverDeadlineAt
        - tradeDeadlineAt
        - finished
      properties:
        number:
          $ref: '#/components/schemas/GameweekNumber'
        name:
          type: string
          examples: ['Gameweek 7']
        deadlineAt:
          type: string
          format: date-time
          description: First kickoff minus 90 minutes. Lineups lock.
        waiverDeadlineAt:
          type: string
          format: date-time
          description: Deadline minus 24 hours.
        tradeDeadlineAt:
          type: string
          format: date-time
          description: Deadline minus 48 hours.
        finished:
          type: boolean
    GameweekStatus:
      type: object
      required: [current, next, bonusAdded, dataChecked, waiversProcessed]
      properties:
        current:
          $ref: '#/components/schemas/Gameweek'
        next:
          oneOf:
            - $ref: '#/components/schemas/Gameweek'
            - type: 'null'
          description: Null after gameweek 38.
        bonusAdded:
          type: boolean
        dataChecked:
          type: boolean
        waiversProcessed:
          type: boolean
    GameweekStatusResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GameweekStatus'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- imports
    DraftLeagueUrl:
      description: |
        A league link from draft.premierleague.com, for example
        `https://draft.premierleague.com/league/12345`, as a user pastes it:
        with or without `www.` or the scheme, with a locale segment
        (`/en/league/12345`), a trailing path, query or fragment, or just
        the league id. Links from fantasy.premierleague.com (classic FPL)
        are rejected.
      type: string
      maxLength: 2048
    ImportSeat:
      description: The caller's own team in the league, as numbered in the preview (`seats[].seat`).
      type: integer
      minimum: 1
      maximum: 20
    ImportFromUrl:
      type: object
      required: [draftLeagueUrl, seat]
      properties:
        draftLeagueUrl:
          $ref: '#/components/schemas/DraftLeagueUrl'
        seat:
          $ref: '#/components/schemas/ImportSeat'
      additionalProperties: false
    ImportFromId:
      type: object
      required: [fplLeagueId, seat]
      properties:
        fplLeagueId:
          $ref: '#/components/schemas/FplLeagueId'
        seat:
          $ref: '#/components/schemas/ImportSeat'
      additionalProperties: false
    ImportRequest:
      description: Exactly one of `draftLeagueUrl` or `fplLeagueId`, and the caller's `seat`.
      oneOf:
        - $ref: '#/components/schemas/ImportFromUrl'
        - $ref: '#/components/schemas/ImportFromId'
      example:
        draftLeagueUrl: https://draft.premierleague.com/league/12345
        seat: 1
    ImportStatus:
      description: Open enum. `queued` and `running` are active; poll until another value.
      type: string
      enum: [queued, running, succeeded, failed]
    ImportProgress:
      description: Upstream requests done out of the total (0 of 0 while queued).
      type: object
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Import:
      type: object
      required: [id, fplLeagueId, status, progress, error, leagueId, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ImportId'
        fplLeagueId:
          $ref: '#/components/schemas/FplLeagueId'
        status:
          $ref: '#/components/schemas/ImportStatus'
        progress:
          $ref: '#/components/schemas/ImportProgress'
        error:
          description: Set when `status` is `failed`.
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        leagueId:
          description: The imported league, set when `status` is `succeeded`.
          oneOf:
            - $ref: '#/components/schemas/LeagueId'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: imp_01k7m2xq8y0000000000000001
        fplLeagueId: 12345
        status: running
        progress: { done: 31, total: 85 }
        error: null
        leagueId: null
        createdAt: '2026-10-17T14:00:00Z'
        updatedAt: '2026-10-17T14:00:16Z'
    ImportResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Import'
        meta:
          $ref: '#/components/schemas/Meta'
    ImportPreviewSeat:
      type: object
      required: [seat, teamName, managerName]
      properties:
        seat:
          $ref: '#/components/schemas/ImportSeat'
        teamName:
          type: string
        managerName:
          type: string
    ImportLeagueScoring:
      description: Open enum. Only `h2h` leagues can be imported.
      type: string
      enum: [h2h, classic, unknown]
    ImportPreview:
      description: Enough to answer "Is this your league?" and "Which team is yours?".
      type: object
      required:
        [
          fplLeagueId,
          name,
          teamCount,
          seats,
          currentGameweek,
          scoring,
          draftComplete,
          importable,
          problem,
          alreadyImportedLeagueId,
        ]
      properties:
        fplLeagueId:
          $ref: '#/components/schemas/FplLeagueId'
        name:
          type: string
        teamCount:
          type: integer
          minimum: 1
          maximum: 20
        seats:
          type: array
          description: Real teams only, in seat order; the league-average pseudo-entry is excluded.
          items:
            $ref: '#/components/schemas/ImportPreviewSeat'
        currentGameweek:
          type: integer
          minimum: 0
          maximum: 38
          description: FPL's current gameweek (0 before the season).
        scoring:
          $ref: '#/components/schemas/ImportLeagueScoring'
        draftComplete:
          type: boolean
        importable:
          type: boolean
        problem:
          description: |
            Why it cannot be imported, null when it can: `unsupported-league`,
            `draft-not-complete`, `import-unavailable` (this server's player
            data does not come from FPL, so no league can be imported here) or
            `stats-not-ready` (FPL's player data is still loading; try again
            later). Open set: show `detail`.
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        alreadyImportedLeagueId:
          description: The caller's league from an earlier import of this FPL league.
          oneOf:
            - $ref: '#/components/schemas/LeagueId'
            - type: 'null'
    ImportPreviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ImportPreview'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- sync
    SyncJobKind:
      description: 'Open enum. `resync`: a re-sync from FPL. `check`: a check against FPL.'
      type: string
      enum: [resync, check]
    SyncPending:
      description: A re-sync or check that is queued or running.
      type: object
      required: [kind, requestedAt]
      properties:
        kind:
          $ref: '#/components/schemas/SyncJobKind'
        requestedAt:
          type: string
          format: date-time
    SyncReportStatus:
      description: 'Open enum. `incomplete`: nothing disagrees, but some items could not be checked yet.'
      type: string
      enum: [clean, mismatch, incomplete]
    SyncItemStatus:
      description: |
        Open enum. `pending`: a trade FPL accepted but has not processed
        or vetoed yet, imported here as the same pending trade. Not
        failing; the next re-sync applies what FPL decides.
      type: string
      enum: [ok, mismatch, unverified, pending]
    SyncItemKind:
      description: |
        Open enum. `points`: a team's gameweek points recomputed here vs
        FPL's. `subs`: our auto-subs vs FPL's. `result`: a head-to-head
        score. `standing`: our table from our scores. `table`: our table
        logic fed FPL's scores. `squad`: a team's 15 in a gameweek vs its
        FPL picks. `owner`: every player's current owner. `waiver_order`.
        `pending_trade`: an accepted FPL trade still waiting for FPL to
        process or veto it.
        `setting`: an FPL setting with no equivalent here. Shadow checks
        only: `waiver` (one FPL claim's outcome vs ours), `trade` (a closed
        FPL trade's status vs ours), `lineup` (a locked XI and bench vs the
        FPL picks), `player_points` (a starter's points vs FPL's live
        points).
      type: string
      enum:
        [
          points,
          subs,
          result,
          standing,
          table,
          squad,
          owner,
          waiver_order,
          pending_trade,
          setting,
          waiver,
          trade,
          lineup,
          player_points,
        ]
    SyncExplanation:
      type: object
      required: [note, explainedBy, explainedAt]
      properties:
        note:
          type: string
        explainedBy:
          description: The commissioner who explained it (display name).
          type: string
        explainedAt:
          type: string
          format: date-time
    SyncItem:
      description: One failing or pending check of a verification.
      type: object
      required: [key, kind, gameweek, team, status, ours, theirs, note, explanation]
      properties:
        key:
          description: Stable across verifications; explain an item by it.
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/SyncItemKind'
        gameweek:
          oneOf:
            - $ref: '#/components/schemas/GameweekNumber'
            - type: 'null'
        team:
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
        status:
          $ref: '#/components/schemas/SyncItemStatus'
        ours:
          description: What our engines say.
          type: string
        theirs:
          description: What FPL says.
          type: string
        note:
          type: [string, 'null']
        explanation:
          description: The commissioner's explanation; null when there is none.
          oneOf:
            - $ref: '#/components/schemas/SyncExplanation'
            - type: 'null'
    SyncItemCounts:
      type: object
      required: [ok, mismatch, unverified, pending]
      properties:
        ok:
          type: integer
          minimum: 0
        mismatch:
          type: integer
          minimum: 0
        unverified:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    SyncVerification:
      description: |
        The latest check against FPL (after the import, each re-sync and
        each manual check), recomputed with our engines. Informational:
        nothing waits on it, and moves made here differ from FPL by design.
        Only failing and pending items are listed; `counts` covers all of
        them.
      type: object
      required: [status, checkedAt, counts, failing, unexplained, pending]
      properties:
        status:
          $ref: '#/components/schemas/SyncReportStatus'
        checkedAt:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/SyncItemCounts'
        failing:
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
        unexplained:
          description: Failing items without an explanation.
          type: integer
          minimum: 0
        pending:
          description: |
            Trades pending on FPL (`pending_trade` items with status
            `pending`): accepted there, not yet processed or vetoed. Not
            failing; the next re-sync applies what FPL decided.
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
    ShadowCheck:
      description: |
        The latest automatic, read-only comparison with FPL Draft (a shadow
        check), run from the FPL calendar until the switch-over: after the
        waiver run, around each deadline, at each match's kickoff, half
        time, full time and bonus, and when FPL marks the data checked. It
        never changes the league. A difference on data FPL has not
        finalized (a live match, bonus not added) is `pending`; it is a
        `mismatch` only once final, and the commissioner is notified
        (`fpl_check_mismatch`).
      type: object
      required: [checkedAt, reason, gameweek, status, counts, mismatches, pending]
      properties:
        checkedAt:
          type: string
          format: date-time
        reason:
          description: 'Open enum: after_waivers, before_deadline, after_deadline, kickoff, half_time, full_time, bonus, data_checked, admin.'
          type: string
        gameweek:
          oneOf:
            - $ref: '#/components/schemas/GameweekNumber'
            - type: 'null'
        status:
          $ref: '#/components/schemas/SyncReportStatus'
        counts:
          $ref: '#/components/schemas/SyncItemCounts'
        mismatches:
          description: Differences on finalized data, with the team, player and numbers.
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
        pending:
          description: Differences FPL may still resolve (live data).
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
    LeagueSync:
      type: object
      required:
        [fplLeagueId, lastSyncedAt, lastAttemptAt, pending, lastError, note, verification, shadow]
      properties:
        fplLeagueId:
          $ref: '#/components/schemas/FplLeagueId'
        lastSyncedAt:
          description: |
            When FPL's state was last applied: the import or the last
            re-sync. A re-sync replaces every move made here since then.
          type: [string, 'null']
          format: date-time
        lastAttemptAt:
          description: When the last re-sync or check ran.
          type: [string, 'null']
          format: date-time
        pending:
          oneOf:
            - $ref: '#/components/schemas/SyncPending'
            - type: 'null'
        lastError:
          description: Why the last re-sync or check failed; the league kept its state.
          type: [string, 'null']
        note:
          description: The last re-sync's notice for every member, e.g. the trades and claims it cancelled.
          type: [string, 'null']
        verification:
          description: Commissioner only; null for members and before the first check.
          oneOf:
            - $ref: '#/components/schemas/SyncVerification'
            - type: 'null'
        shadow:
          description: Commissioner only; null for members and before the first shadow check.
          oneOf:
            - $ref: '#/components/schemas/ShadowCheck'
            - type: 'null'
    LeagueSyncResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LeagueSync'
        meta:
          $ref: '#/components/schemas/Meta'
    SyncExplanationInput:
      type: object
      required: [key, note]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
        note:
          type: string
          minLength: 1
          maxLength: 500
    ResyncInput:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          description: Must be true; a re-sync replaces every move made here since the last one.
          type: boolean
          const: true
    Seat:
      type: object
      required: [team, fplManagerName, claimed, owner, invite]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        fplManagerName:
          description: The FPL manager of the seat, to know whom to send the link.
          type: string
        claimed:
          type: boolean
        owner:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        invite:
          description: The current claim link while unclaimed.
          oneOf:
            - $ref: '#/components/schemas/Invite'
            - type: 'null'
    SeatListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- league
    PositionCounts:
      description: A number per position.
      type: object
      required: [GKP, DEF, MID, FWD]
      properties:
        GKP:
          type: integer
          minimum: 0
        DEF:
          type: integer
          minimum: 0
        MID:
          type: integer
          minimum: 0
        FWD:
          type: integer
          minimum: 0
      example: { GKP: 2, DEF: 5, MID: 5, FWD: 3 }
    LineupRules:
      description: |
        The starting XI. v1: exactly 11 starters with 1 GKP, 3-5 DEF, 2-5
        MID and 1-3 FWD; the first bench slot is the backup goalkeeper. No
        captain.
      type: object
      required: [starters, minStarters, maxStarters, benchGoalkeeperFirst]
      properties:
        starters:
          type: integer
          examples: [11]
        minStarters:
          $ref: '#/components/schemas/PositionCounts'
        maxStarters:
          $ref: '#/components/schemas/PositionCounts'
        benchGoalkeeperFirst:
          type: boolean
    TradeReview:
      description: |
        Open enum. `none`: an accepted trade processes at once.
        `commissioner`: the commissioner approves or vetoes during the
        review window (approved automatically when it closes).
        `league_vote`: the other managers can vote to veto during the
        window; it processes when the window closes unless vetoed.
      type: string
      enum: [none, commissioner, league_vote]
    DraftSettings:
      type: object
      required: [type, pickTimerSeconds, startsAt]
      properties:
        type:
          description: Open enum.
          type: string
          enum: [snake]
        pickTimerSeconds:
          type: integer
          minimum: 15
          maximum: 86400
          examples: [60]
        startsAt:
          description: Scheduled start; null until the commissioner sets it.
          type: [string, 'null']
          format: date-time
    WaiverOrderRule:
      description: |
        Open enum. How each waiver run's order is set (ADR 0008 rule 12).
        `reverse_standings` (FPL Draft's rule, the default): every run starts
        from the standings after the last finished gameweek, worst first;
        ties on league points, then fewer points for, then the team that
        joined the league first; before any result, the reverse of the
        draft's first round. `rolling`: starts as the reverse of the draft's
        first round; a team that wins a claim stays at the back for later
        runs. Under both, a team that wins a claim moves to the back for the
        rest of that run.
      type: string
      enum: [reverse_standings, rolling]
    WaiverSettings:
      type: object
      required: [type, order]
      properties:
        type:
          description: |
            Open enum. `rolling_priority`: claims are processed by a priority
            order; `order` says how that order is set.
          type: string
          enum: [rolling_priority]
        order:
          $ref: '#/components/schemas/WaiverOrderRule'
    TradeSettings:
      type: object
      required: [review, reviewHours, vetoThreshold, deadlineGameweek]
      properties:
        review:
          $ref: '#/components/schemas/TradeReview'
        reviewHours:
          type: integer
          minimum: 0
          maximum: 72
          description: Length of the review (veto) window; 0 when `review` is none.
        vetoThreshold:
          type: number
          minimum: 0
          maximum: 1
          description: |
            `league_vote` only: the share of managers not in the trade whose
            veto votes block it (0.5 = half, rounded up).
        deadlineGameweek:
          type: [integer, 'null']
          minimum: 1
          maximum: 38
          description: No trades after this gameweek's deadline. Null for none.
    LeagueSettings:
      type: object
      required:
        - teamCount
        - scoring
        - schedule
        - roster
        - lineup
        - draft
        - waivers
        - trades
        - startGameweek
        - endGameweek
      properties:
        teamCount:
          type: integer
          minimum: 2
          maximum: 20
          description: |
            Real teams (2 to 20). With an odd count, each gameweek one team
            plays the league-average opponent, which is never counted here.
        scoring:
          description: "Open enum. `fpl_standard`: FPL's 2026-27 points rules."
          type: string
          enum: [fpl_standard]
        schedule:
          description: 'Open enum. `h2h`: head to head, win 3, draw 1, loss 0.'
          type: string
          enum: [h2h]
        roster:
          $ref: '#/components/schemas/PositionCounts'
        lineup:
          $ref: '#/components/schemas/LineupRules'
        draft:
          $ref: '#/components/schemas/DraftSettings'
        waivers:
          $ref: '#/components/schemas/WaiverSettings'
        trades:
          $ref: '#/components/schemas/TradeSettings'
        startGameweek:
          $ref: '#/components/schemas/GameweekNumber'
          description: |
            The league's first scoring gameweek. Before the draft, the earliest
            it may start; when the draft completes it becomes the first
            gameweek whose deadline is after the draft (ADR 0010), so a league
            drafted mid-season has no rosters, matchups or results before it.
        endGameweek:
          $ref: '#/components/schemas/GameweekNumber'
    LeagueStatus:
      description: |
        Open enum. `pre_draft`: inviting managers. `drafting`: the draft is
        running or paused. `in_season`: drafted, gameweeks being played.
        `complete`: the season is over (also a league whose draft finished
        after the last gameweek's deadline: rosters but no matchups).
      type: string
      enum: [pre_draft, drafting, in_season, complete]
    LeagueSource:
      description: |
        Open enum. `native`: created in this app. `fpl_import`: imported
        from FPL Draft (docs/adr/0012); see `GET /v1/leagues/{leagueId}/sync`.
      type: string
      enum: [native, fpl_import]
    LeagueRole:
      description: Open enum.
      type: string
      enum: [commissioner, member]
    LeagueSummary:
      type: object
      required: [id, name, season, status, source, teamCount, memberCount, fplLeagueId]
      properties:
        id:
          $ref: '#/components/schemas/LeagueId'
        name:
          type: string
        season:
          $ref: '#/components/schemas/Season'
        status:
          $ref: '#/components/schemas/LeagueStatus'
        source:
          $ref: '#/components/schemas/LeagueSource'
        teamCount:
          type: integer
          description: Teams the league is set up for.
        memberCount:
          type: integer
          description: Teams that have a manager.
        fplLeagueId:
          description: Only for an imported league (`source` fpl_import).
          oneOf:
            - $ref: '#/components/schemas/FplLeagueId'
            - type: 'null'
      example:
        id: lg_01k7m2xq8rfv3c9a4t6wbn5hdy
        name: The Sunday Draft
        season: 2026-27
        status: in_season
        source: native
        teamCount: 9
        memberCount: 9
        fplLeagueId: null
    LeagueViewer:
      description: The caller's place in the league.
      type: object
      required: [role, team]
      properties:
        role:
          $ref: '#/components/schemas/LeagueRole'
        team:
          description: The caller's team; null for a commissioner without one (not possible in v1).
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
    FormResult:
      description: Open enum.
      type: string
      enum: [W, D, L]
    StandingRow:
      description: One real team. The league-average pseudo-team never has a row.
      type: object
      required:
        - rank
        - team
        - played
        - wins
        - draws
        - losses
        - pointsFor
        - pointsAgainst
        - leaguePoints
        - form
      properties:
        rank:
          type: integer
          minimum: 1
        team:
          $ref: '#/components/schemas/TeamRef'
        played:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        pointsFor:
          type: integer
          description: Total fantasy points scored. Breaks ties on league points.
        pointsAgainst:
          type: integer
        leaguePoints:
          type: integer
          description: Win 3, draw 1, loss 0.
        form:
          type: array
          description: Last five results, oldest first.
          maxItems: 5
          items:
            $ref: '#/components/schemas/FormResult'
    AverageOpponent:
      description: |
        The league-average opponent FPL adds when a league has an odd number
        of teams. It has a score but no lineup. `points` is the floor of the
        mean gameweek points of all real teams, including the team it plays.
      type: object
      required: [kind, points, basis]
      properties:
        kind:
          type: string
          const: average
        points:
          type: integer
        basis:
          description: How `points` is derived. Open enum.
          type: string
          const: floor_mean_all_teams
    TeamScore:
      description: A real team's side of a matchup summary.
      type: object
      required: [kind, team, points]
      properties:
        kind:
          type: string
          const: team
        team:
          $ref: '#/components/schemas/TeamRef'
        points:
          type: integer
          description: Current total with auto-subs applied as they stand.
    MatchupSide:
      description: One side of a matchup summary. Discriminated on `kind`.
      oneOf:
        - $ref: '#/components/schemas/TeamScore'
        - $ref: '#/components/schemas/AverageOpponent'
      discriminator:
        propertyName: kind
        mapping:
          team: '#/components/schemas/TeamScore'
          average: '#/components/schemas/AverageOpponent'
    MatchupSummary:
      type: object
      required: [id, gameweek, state, home, away]
      properties:
        id:
          $ref: '#/components/schemas/MatchupId'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        state:
          $ref: '#/components/schemas/ScoreState'
        home:
          $ref: '#/components/schemas/MatchupSide'
        away:
          $ref: '#/components/schemas/MatchupSide'
    LeagueHome:
      type: object
      required: [league, settings, viewer, currentGameweek, standings, matchups]
      properties:
        transactionPhase:
          $ref: '#/components/schemas/TransactionPhase'
          description: Set once the league is in season.
        league:
          $ref: '#/components/schemas/LeagueSummary'
        settings:
          $ref: '#/components/schemas/LeagueSettings'
        viewer:
          $ref: '#/components/schemas/LeagueViewer'
        currentGameweek:
          $ref: '#/components/schemas/Gameweek'
          description: |
            The season's current gameweek; for a drafted league never before
            `settings.startGameweek` (a league drafted mid-season shows its
            first gameweek, upcoming, until the season reaches it).
        standings:
          type: array
          description: Real teams only.
          items:
            $ref: '#/components/schemas/StandingRow'
        matchups:
          type: array
          description: This gameweek's matchups.
          items:
            $ref: '#/components/schemas/MatchupSummary'
    LeagueHomeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LeagueHome'
        meta:
          $ref: '#/components/schemas/Meta'
    MatchupListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchupSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- matchup
    FixtureStatus:
      description: |
        Open enum. `finished_provisional`: the match is over but its stats
        (and bonus) are not final. `postponed`: the fixture moved out of this
        gameweek; it counts in the gameweek it is replayed.
      type: string
      enum: [scheduled, live, finished_provisional, finished, postponed]
    PointsStat:
      description: Open enum of FPL's `explain` identifiers.
      type: string
      enum:
        - minutes
        - goals_scored
        - assists
        - clean_sheets
        - goals_conceded
        - own_goals
        - penalties_saved
        - penalties_missed
        - yellow_cards
        - red_cards
        - saves
        - defensive_contribution
        - bonus
    PointsLine:
      type: object
      required: [stat, value, points]
      properties:
        stat:
          $ref: '#/components/schemas/PointsStat'
        value:
          type: integer
          description: Raw count, for example 2 goals or 74 minutes.
        points:
          type: integer
          description: Fantasy points from this stat.
      example:
        stat: goals_scored
        value: 1
        points: 5
    PlayerFixture:
      description: One player in one fixture. Double gameweeks have two.
      type: object
      required:
        - fixtureId
        - opponent
        - isHome
        - kickoffAt
        - status
        - minutes
        - points
        - bonusProvisional
        - breakdown
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        opponent:
          $ref: '#/components/schemas/ClubRef'
        isHome:
          type: boolean
        kickoffAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FixtureStatus'
        homeScore:
          type: [integer, 'null']
        awayScore:
          type: [integer, 'null']
        minutes:
          type: integer
          minimum: 0
        points:
          type: integer
        bonusProvisional:
          type: boolean
          description: True while bonus points are projected from BPS.
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/PointsLine'
    AutoSubState:
      description: Open enum.
      type: string
      enum: [none, projected_out, projected_in, confirmed_out, confirmed_in]
    LineupSlot:
      type: object
      required: [slot, player, points, minutes, autoSub, fixtures]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 15
          description: 1-11 starters, 12-15 bench. Slot 12 is the bench keeper.
        player:
          $ref: '#/components/schemas/PlayerRef'
        points:
          type: integer
          description: Total across all fixtures this gameweek.
        minutes:
          type: integer
          minimum: 0
        autoSub:
          $ref: '#/components/schemas/AutoSubState'
        fixtures:
          type: array
          description: Empty on a blank gameweek; two entries in a double.
          items:
            $ref: '#/components/schemas/PlayerFixture'
    AutoSubStatus:
      type: string
      enum: [projected, confirmed]
      description: |
        Open enum. Auto-subs are applied at the end of the gameweek, so they
        stay `projected` until every relevant fixture is finished.
    AutoSub:
      type: object
      required: [status, slotOut, slotIn, playerOutId, playerInId]
      properties:
        status:
          $ref: '#/components/schemas/AutoSubStatus'
        slotOut:
          type: integer
          minimum: 1
          maximum: 11
        slotIn:
          type: integer
          minimum: 12
          maximum: 15
        playerOutId:
          $ref: '#/components/schemas/PlayerId'
        playerInId:
          $ref: '#/components/schemas/PlayerId'
    TeamLineup:
      description: A real team's side of a matchup, with its lineup.
      type: object
      required:
        - kind
        - team
        - formation
        - totalPoints
        - benchPoints
        - starters
        - bench
        - autoSubs
      properties:
        kind:
          type: string
          const: team
        team:
          $ref: '#/components/schemas/TeamRef'
        formation:
          type: string
          description: Defenders-midfielders-forwards of the XI.
          examples: ['4-4-2']
        totalPoints:
          type: integer
          description: Starters after applying auto-subs as they currently stand.
        benchPoints:
          type: integer
          description: Points on the bench that do not count.
        starters:
          type: array
          description: Slots 1-11.
          minItems: 11
          maxItems: 11
          items:
            $ref: '#/components/schemas/LineupSlot'
        bench:
          type: array
          description: Slots 12-15.
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/LineupSlot'
        autoSubs:
          type: array
          items:
            $ref: '#/components/schemas/AutoSub'
    MatchupDetailSide:
      description: One side of a matchup detail. Discriminated on `kind`.
      oneOf:
        - $ref: '#/components/schemas/TeamLineup'
        - $ref: '#/components/schemas/AverageOpponent'
      discriminator:
        propertyName: kind
        mapping:
          team: '#/components/schemas/TeamLineup'
          average: '#/components/schemas/AverageOpponent'
    MatchupDetail:
      type: object
      required: [id, gameweek, state, home, away]
      properties:
        id:
          $ref: '#/components/schemas/MatchupId'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        state:
          $ref: '#/components/schemas/ScoreState'
        home:
          $ref: '#/components/schemas/MatchupDetailSide'
        away:
          $ref: '#/components/schemas/MatchupDetailSide'
    MatchupDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/MatchupDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    MatchupPreviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/MatchupPreview'
        meta:
          $ref: '#/components/schemas/Meta'
    MatchupPreview:
      type: object
      required: [id, gameweek, home, away]
      properties:
        id:
          $ref: '#/components/schemas/MatchupId'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        home:
          $ref: '#/components/schemas/PreviewSide'
        away:
          $ref: '#/components/schemas/PreviewSide'
    PreviewSide:
      type: object
      description: |
        One side of a preview. `kind` is open: `team` carries the team and
        its lineup; `average` (the league average) has none.
      required: [kind, starters, bench]
      properties:
        kind:
          type: string
          enum: [team, average]
        team:
          $ref: '#/components/schemas/TeamRef'
        formation:
          type: string
          description: e.g. `4-4-2`; absent without a lineup.
        lineupGameweek:
          $ref: '#/components/schemas/GameweekNumber'
          description: The gameweek whose lineup this is (the latest locked one for another team).
        starters:
          type: array
          items:
            $ref: '#/components/schemas/PreviewSlot'
        bench:
          type: array
          items:
            $ref: '#/components/schemas/PreviewSlot'
    PreviewSlot:
      type: object
      required: [slot, player, fixtures]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 15
        player:
          $ref: '#/components/schemas/PlayerRef'
        fixtures:
          type: array
          description: The player's club's fixtures in the gameweek; empty on a blank.
          items:
            $ref: '#/components/schemas/PreviewFixture'
    PreviewFixture:
      type: object
      required: [fixtureId, opponent, isHome, kickoffAt]
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        opponent:
          $ref: '#/components/schemas/ClubRef'
        isHome:
          type: boolean
        kickoffAt:
          type: string
          format: date-time
    # ---------------------------------------------------------------- team
    Record:
      type: object
      required: [rank, played, wins, draws, losses, pointsFor, pointsAgainst, leaguePoints]
      properties:
        rank:
          type: integer
          minimum: 1
        played:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        pointsFor:
          type: integer
        pointsAgainst:
          type: integer
        leaguePoints:
          type: integer
    UpcomingFixture:
      type: object
      description: |
        A fixture still to be played. A postponed fixture that has not been
        rescheduled is TBC: `gameweek` is null when it belongs to no
        gameweek yet, and `kickoffAt` is null when it has no date.
      required: [fixtureId, gameweek, opponent, isHome, kickoffAt]
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        gameweek:
          type: [integer, 'null']
          minimum: 1
          maximum: 38
          description: Null while the fixture is in no gameweek (postponed, TBC).
        opponent:
          $ref: '#/components/schemas/ClubRef'
        isHome:
          type: boolean
        kickoffAt:
          type: [string, 'null']
          format: date-time
          description: Null while the fixture has no date (TBC).
        status:
          $ref: '#/components/schemas/FixtureStatus'
    RowFixture:
      type: object
      description: |
        A remaining fixture on a list or roster row, compact: the opponent
        is its club code; the club's name and crest come from `/v1/clubs`
        (the player card's `upcoming` keeps the full `UpcomingFixture`). As
        there, a postponed fixture not yet rescheduled is TBC: `gameweek`
        is null when it belongs to no gameweek, `kickoffAt` null when it
        has no date. `status` is left out while the fixture is scheduled.
      required: [fixtureId, gameweek, opponent, isHome, kickoffAt]
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        gameweek:
          type: [integer, 'null']
          minimum: 1
          maximum: 38
        opponent:
          type: string
          minLength: 2
          maxLength: 4
          description: The opponent's club code (`ClubRef.code`).
        isHome:
          type: boolean
        kickoffAt:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/FixtureStatus'
    RosterEntry:
      type: object
      required: [slot, player, totalPoints, gameweekPoints, acquiredVia, nextFixtures]
      properties:
        slot:
          description: |
            Position in the roster order. For the team's owner, the slot in
            the lineup for the next gameweek. For everyone else, the slot in
            the last locked lineup (players added since come after it, by
            position), because the next gameweek's lineup is private until
            its deadline.
          type: integer
          minimum: 1
          maximum: 15
        player:
          $ref: '#/components/schemas/PlayerRef'
        totalPoints:
          type: integer
          description: Season total.
        gameweekPoints:
          type: integer
        acquiredVia:
          description: Open enum.
          type: string
          enum: [draft, waiver, free_agent, trade]
        nextFixtures:
          type: array
          description: |
            Every fixture of the player's club not yet kicked off this
            season (doubles give two in a gameweek, blanks none), in kickoff
            order; postponed fixtures without a date (TBC) last. Empty once
            the club's season is over. Compact (`RowFixture`): the opponent
            is a club code.
          items:
            $ref: '#/components/schemas/RowFixture'
    TeamResult:
      type: object
      required: [gameweek, matchupId, opponent, pointsFor, pointsAgainst, result]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        matchupId:
          $ref: '#/components/schemas/MatchupId'
        opponent:
          $ref: '#/components/schemas/Opponent'
        pointsFor:
          type: integer
        pointsAgainst:
          type: integer
        result:
          $ref: '#/components/schemas/FormResult'
    NextOpponent:
      type: object
      required: [gameweek, matchupId, opponent, deadlineAt]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        matchupId:
          $ref: '#/components/schemas/MatchupId'
        opponent:
          $ref: '#/components/schemas/Opponent'
        deadlineAt:
          type: string
          format: date-time
    TeamDetail:
      type: object
      required: [team, record, roster, results, nextOpponent]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        record:
          $ref: '#/components/schemas/Record'
        roster:
          type: array
          description: The 15-man squad in current lineup order.
          items:
            $ref: '#/components/schemas/RosterEntry'
        results:
          type: array
          description: Completed gameweeks, newest first.
          items:
            $ref: '#/components/schemas/TeamResult'
        nextOpponent:
          oneOf:
            - $ref: '#/components/schemas/NextOpponent'
            - type: 'null'
    TeamDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TeamDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- players
    RosterStatus:
      description: |
        Open enum. `rostered`: on a team in this league. `waivers`: can only
        be claimed through waivers until `waiverClearsAt`. `free_agent`: can
        be added at once. `locked`: unowned while the gameweek is locked
        (from its deadline until it is finished): no free-agent signing;
        `waiverClearsAt` is the next waiver run, after which signings
        reopen. A claim for that run may still be made.
      type: string
      enum: [free_agent, waivers, rostered, locked]
    TransactionPhase:
      type: object
      description: |
        The league's transaction window (FPL Draft). For each gameweek N:
        `waivers` (claims) until N's waiver time; the waiver run; then
        `free_agency` until N's deadline; then `locked` (no free-agent
        signings) until gameweek N is finished, after which the next
        gameweek's `waivers` phase starts.
      required: [phase, gameweek, until]
      properties:
        phase:
          description: Open enum.
          type: string
          enum: [waivers, free_agency, locked]
        gameweek:
          description: The gameweek moves made now are for.
          type: integer
          minimum: 1
        until:
          type: [string, 'null']
          format: date-time
          description: |
            When the phase ends: the waiver run (`waivers`), the deadline
            (`free_agency`), or for `locked` the next waiver run, when
            free-agent signings reopen. Null when unknown.
    PlayerListItem:
      type: object
      required:
        [
          player,
          owner,
          rosterStatus,
          waiverClearsAt,
          totalPoints,
          gameweekPoints,
          form,
          draftRank,
          minutes,
          formChange,
          sortValue,
          seasonStats,
          nextFixtures,
        ]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        owner:
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
          description: Null unless `rosterStatus` is rostered.
        formChange:
          type: [number, 'null']
          description: |
            `form` minus the same mean for the two gameweeks before
            those (gameweeks 3 and 4 for gameweek 7's form), one decimal:
            positive is rising. Null until a gameweek before the form
            window is completed.
        seasonStats:
          $ref: '#/components/schemas/PlayerSeasonStats'
        nextFixtures:
          type: array
          description: |
            As `RosterEntry.nextFixtures`: every remaining fixture of the
            player's club, in kickoff order, TBC last.
          items:
            $ref: '#/components/schemas/RowFixture'
        rosterStatus:
          $ref: '#/components/schemas/RosterStatus'
        waiverClearsAt:
          type: [string, 'null']
          format: date-time
          description: When a player on waivers becomes a free agent.
        form:
          type: [number, 'null']
          description: |
            Mean points over the last two completed gameweeks before the
            current one: for gameweek 7 (live or up next), gameweeks 5 and 6.
            A gameweek without minutes or without a match counts as 0 and
            a double gameweek's points are both matches', so the divisor is
            always 2, or the number of completed gameweeks when fewer (in
            gameweek 2, gameweek 1's points). Null in gameweek 1, before
            any gameweek is completed. One decimal.
        draftRank:
          type: integer
          minimum: 1
          description: Pre-draft ranking, 1 = best. Autopick uses it.
        totalPoints:
          type: integer
        gameweekPoints:
          type: integer
        minutes:
          type: integer
          description: Season minutes.
        sortValue:
          type: [number, 'null']
          description: |
            The value of the stat the list is sorted by (see the `sort`
            parameter): an integer for counts, two decimals for the ICT
            and expected stats, one for form and points per match. Null
            for `name`, or when the stat is untracked for the player.
    PlayerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlayerListItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PlayerSeasonStats:
      description: |
        Season totals for a list row's stat strip (by position: keepers
        saves and clean sheets, defenders clean sheets and defensive
        contribution points, others xGI, goals and assists).
      type: object
      required:
        [goals, assists, cleanSheets, saves, defensiveContributionPoints, expectedGoalInvolvements]
      properties:
        goals:
          type: integer
        assists:
          type: integer
        cleanSheets:
          type: integer
          description: Matches with a clean sheet and 60+ minutes, as FPL counts them.
        saves:
          type: integer
        defensiveContributionPoints:
          type: integer
          description: Points from defensive contributions.
        expectedGoalInvolvements:
          type: [number, 'null']
          description: Season xGI, two decimals; null when the source publishes none.
    WatchlistEntry:
      type: object
      required: [player, addedAt]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        addedAt:
          type: string
          format: date-time
    WatchlistResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/WatchlistEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    WatchlistEntryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WatchlistEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    # --- Notifications ---------------------------------------------------
    NotificationType:
      description: |
        Open enum. Personal: trade_offered, trade_accepted, trade_declined,
        trade_reviewed (vetoed or approved by review), trade_processed,
        waivers_due (1 hour before the league's waiver deadline),
        free_agency_closing (1 hour before free agency closes),
        waiver_result, player_goal, player_assist, player_own_goal,
        player_red_card, player_defensive_contribution (once per match, when
        the threshold gives the points), player_clean_sheet (at full time,
        or when the player goes off after 60 minutes with it intact),
        player_news. League: league_trade_processed, opponent_goal,
        opponent_assist, opponent_own_goal, opponent_red_card,
        opponent_defensive_contribution, opponent_clean_sheet,
        opponent_news. Extras: lineup_invalid (1 hour before lock with an
        empty or invalid XI), draft_starting, draft_your_pick. Commissioner
        of an imported league only, with no switch: fpl_check_mismatch (a
        shadow check found finalized data that differs from FPL).
      type: string
      examples: [player_goal]
    NotificationGroup:
      description: 'Open enum: personal, league.'
      type: string
      examples: [personal]
    NotificationTypeInfo:
      type: object
      required: [type, group, label]
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        group:
          $ref: '#/components/schemas/NotificationGroup'
        label:
          type: string
          description: The switch's label, in English.
    NotificationSetting:
      type: object
      required: [type, enabled]
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        enabled:
          type: boolean
    LeagueNotificationPreferences:
      type: object
      required: [leagueId, leagueName, settings]
      properties:
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        leagueName:
          type: string
        settings:
          type: array
          description: One per type in `types`, in that order.
          items:
            $ref: '#/components/schemas/NotificationSetting'
    NotificationPreferences:
      type: object
      required: [types, leagues]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTypeInfo'
        leagues:
          type: array
          items:
            $ref: '#/components/schemas/LeagueNotificationPreferences'
    NotificationPreferencesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NotificationPreferences'
        meta:
          $ref: '#/components/schemas/Meta'
    NotificationPreferencesUpdate:
      type: object
      properties:
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        all:
          type: boolean
          description: 'true: All on. false: All off. Applied before `settings`.'
        settings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NotificationSetting'
    NotificationId:
      description: Opaque notification id. `ntf_` and a lowercase ULID.
      type: string
      pattern: '^ntf_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['ntf_01k7m2xq8z0000000000000001']
    Notification:
      type: object
      required: [id, type, title, body, createdAt, readAt]
      properties:
        id:
          $ref: '#/components/schemas/NotificationId'
        type:
          $ref: '#/components/schemas/NotificationType'
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        title:
          type: string
        body:
          type: string
        url:
          type: string
          description: An in-app path to open, e.g. `/leagues/lg_.../players/trades`.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
    NotificationInbox:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: integer
          minimum: 0
    NotificationInboxResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NotificationInbox'
        meta:
          $ref: '#/components/schemas/Meta'
    NotificationReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NotificationId'
        all:
          type: boolean
    PushSubscriptionId:
      description: Opaque push subscription id. `psub_` and a lowercase ULID.
      type: string
      pattern: '^psub_[0-9a-hjkmnp-tv-z]{26}$'
      examples: ['psub_01k7m2xq8z0000000000000001']
    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          maxLength: 200
          description: The browser's P-256 public key, base64url.
        auth:
          type: string
          maxLength: 100
          description: The 16-byte auth secret, base64url.
    PushSubscriptionCreate:
      type: object
      required: [kind]
      properties:
        kind:
          description: 'Open enum: webpush, expo.'
          type: string
          examples: [webpush]
        endpoint:
          type: string
          maxLength: 2048
          description: The push service URL (webpush). Must be https.
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
        expoToken:
          type: string
          maxLength: 200
          description: The Expo push token (expo).
    PushSubscription:
      type: object
      required: [id, kind, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/PushSubscriptionId'
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
    PushSubscriptionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PushSubscription'
        meta:
          $ref: '#/components/schemas/Meta'
    # --- Wave C: trade block, player news and personal tags -------------
    TradeBlockEntry:
      type: object
      required: [player, team, note, wanted, addedAt]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        team:
          $ref: '#/components/schemas/TeamRef'
        note:
          type: string
          maxLength: 140
          description: The team's short pitch; empty when none.
        wanted:
          type: array
          description: Positions the team wants back, in GKP DEF MID FWD order; empty is open to anything.
          maxItems: 4
          items:
            $ref: '#/components/schemas/Position'
        addedAt:
          type: string
          format: date-time
          description: When he went on the block.
    TradeBlockUpdate:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 140
          description: Trimmed. Omitted or empty clears it.
        wanted:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Position'
    TradeBlockResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/TradeBlockEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    TradeBlockEntryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TradeBlockEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    PlayerNewsItem:
      type: object
      required: [player, news, newsAt, chanceOfPlaying, owner]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        news:
          type: string
          description: The note, as `PlayerRef.news`.
        newsAt:
          type: [string, 'null']
          format: date-time
          description: When the source added the note; null when it gives no time.
        chanceOfPlaying:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Percent chance of playing next round; null when unknown.
        owner:
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
          description: The team holding him in this league, or null.
    PlayerNewsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlayerNewsItem'
        meta:
          $ref: '#/components/schemas/Meta'
    PlayerTag:
      description: |
        Open enum: a personal tag. hot 🔥, cold 🧊, target 🎯, sell 💰,
        avoid 🛑. Clients ignore tags they do not know.
      type: string
      enum: [hot, cold, target, sell, avoid]
    PlayerTagEntry:
      type: object
      required: [player, tag, updatedAt]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        tag:
          $ref: '#/components/schemas/PlayerTag'
        updatedAt:
          type: string
          format: date-time
    PlayerTagUpdate:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag:
          $ref: '#/components/schemas/PlayerTag'
    PlayerTagListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/PlayerTagEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    PlayerTagResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PlayerTagEntry'
        meta:
          $ref: '#/components/schemas/Meta'
    TradeBlockUpdatedEvent:
      description: The league's trade block changed; refetch it.
      type: object
      required: [type, leagueId, seq, sentAt]
      properties:
        type:
          type: string
          const: trade_block.updated
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
    # --- end Wave C schemas -----------------------------------------------
    PlayerGameweek:
      type: object
      required: [gameweek, points, minutes, fixtures, stats]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        points:
          type: integer
        minutes:
          type: integer
        fixtures:
          type: array
          items:
            $ref: '#/components/schemas/PlayerFixture'
        stats:
          $ref: '#/components/schemas/PlayerGameStats'
    PlayerGameStats:
      description: |
        A player's match stats for one gameweek, summed over its fixtures (a
        double gameweek has two). Grouped in the card as scoring, underlying
        (ICT and expected) and defensive. Every field is null when the data
        is missing (a blank gameweek, or a source that does not publish it).
      type: object
      required:
        - goalsScored
        - assists
        - cleanSheets
        - goalsConceded
        - ownGoals
        - penaltiesSaved
        - penaltiesMissed
        - yellowCards
        - redCards
        - saves
        - defensiveContributionPoints
        - bonus
        - bps
        - influence
        - creativity
        - threat
        - ictIndex
        - expectedGoals
        - expectedAssists
        - expectedGoalInvolvements
        - expectedGoalsConceded
        - cbit
        - recoveries
        - tackles
      properties:
        goalsScored:
          type: [integer, 'null']
          description: Goals.
        assists:
          type: [integer, 'null']
          description: Assists.
        cleanSheets:
          type: [integer, 'null']
          description: Clean sheets (60+ minutes, none conceded).
        goalsConceded:
          type: [integer, 'null']
          description: Goals conceded while on the pitch.
        ownGoals:
          type: [integer, 'null']
          description: Own goals.
        penaltiesSaved:
          type: [integer, 'null']
          description: Penalties saved.
        penaltiesMissed:
          type: [integer, 'null']
          description: Penalties missed.
        yellowCards:
          type: [integer, 'null']
          description: Yellow cards.
        redCards:
          type: [integer, 'null']
          description: Red cards.
        saves:
          type: [integer, 'null']
          description: Saves.
        defensiveContributionPoints:
          type: [integer, 'null']
          description: Points from defensive contributions (0 or 2 per match).
        bonus:
          type: [integer, 'null']
          description: Bonus points.
        bps:
          type: [integer, 'null']
          description: Bonus points system score. Can be negative.
        influence:
          type: [number, 'null']
          description: ICT influence.
        creativity:
          type: [number, 'null']
          description: ICT creativity.
        threat:
          type: [number, 'null']
          description: ICT threat.
        ictIndex:
          type: [number, 'null']
          description: ICT index.
        expectedGoals:
          type: [number, 'null']
          description: Expected goals (xG).
        expectedAssists:
          type: [number, 'null']
          description: Expected assists (xA).
        expectedGoalInvolvements:
          type: [number, 'null']
          description: Expected goal involvements (xGI).
        expectedGoalsConceded:
          type: [number, 'null']
          description: Expected goals conceded (xGC).
        cbit:
          type: [integer, 'null']
          description: Clearances, blocks, interceptions and tackles.
        recoveries:
          type: [integer, 'null']
          description: Ball recoveries.
        tackles:
          type: [integer, 'null']
          description: Tackles.
    PlayerDetail:
      type: object
      required:
        [
          player,
          season,
          owner,
          rosterStatus,
          waiverClearsAt,
          totalPoints,
          form,
          draftRank,
          minutes,
          positionRank,
          gameweeks,
          upcoming,
          previousSeasons,
        ]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        season:
          $ref: '#/components/schemas/Season'
        owner:
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
          description: The team that owns the player in this league; null otherwise.
        rosterStatus:
          $ref: '#/components/schemas/RosterStatus'
        waiverClearsAt:
          type: [string, 'null']
          format: date-time
        form:
          type: [number, 'null']
          description: As `PlayerListItem.form`.
        draftRank:
          type: integer
          minimum: 1
        totalPoints:
          type: integer
          description: Season total for `season`.
        minutes:
          type: integer
        starts:
          type: [integer, 'null']
          minimum: 0
          description: |
            Season games started, summed from the source's per-match stats
            (as the `starts` sort); null when no match sent it.
        positionRank:
          type: [integer, 'null']
          minimum: 1
          description: |
            Rank by season points among players of the same position, 1 =
            most. Null when unknown.
        gameweeks:
          type: array
          description: Played gameweeks, newest first.
          items:
            $ref: '#/components/schemas/PlayerGameweek'
        upcoming:
          type: array
          description: |
            Every fixture of the player's club still to be played this season
            (doubles included), in kickoff order; TBC fixtures (no date) last.
          items:
            $ref: '#/components/schemas/UpcomingFixture'
        previousSeasons:
          type: array
          description: |
            The player's finished Premier League seasons (FPL history_past,
            linked by the player's permanent id), newest first; empty when
            none are known.
          items:
            $ref: '#/components/schemas/PlayerSeasonTotals'
    PlayerSeasonTotals:
      description: |
        A player's totals for one finished Premier League season. Every stat
        is null when FPL did not track it that season (ICT before 2016/17,
        starts and expected stats before 2022/23, defensive contribution
        before 2024/25) or did not send it: null means unknown, never 0.
        More fields (for example the club) may be added.
      type: object
      required:
        - season
        - points
        - minutes
        - goalsScored
        - assists
        - cleanSheets
        - bonus
        - starts
        - expectedGoals
        - expectedAssists
        - expectedGoalInvolvements
        - ictIndex
        - defensiveContribution
      properties:
        season:
          type: string
          pattern: '^[0-9]{4}/[0-9]{2}$'
          description: FPL's season label, such as `2021/22`.
        points:
          type: [integer, 'null']
          description: FPL points (classic scoring) that season.
        minutes:
          type: [integer, 'null']
        goalsScored:
          type: [integer, 'null']
        assists:
          type: [integer, 'null']
          description: FPL assists, which count more than Opta's (about 20% more).
        cleanSheets:
          type: [integer, 'null']
        bonus:
          type: [integer, 'null']
        starts:
          type: [integer, 'null']
        expectedGoals:
          type: [number, 'null']
        expectedAssists:
          type: [number, 'null']
        expectedGoalInvolvements:
          type: [number, 'null']
        ictIndex:
          type: [number, 'null']
        defensiveContribution:
          type: [integer, 'null']
          description: FPL's defensive contribution count (CBI, tackles, recoveries).
    PlayerDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PlayerDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- transactions
    TransactionKind:
      description: |
        Open enum. `draft_autopick`: a pick made because a manager's clock
        ran out.
      type: string
      enum: [waiver, free_agent, trade, draft_autopick]
    ClaimDeniedReason:
      description: |
        Open enum. `player_in_unavailable`: the player was already taken
        (FPL `di`). `player_out_unavailable`: the player to drop had already
        left the squad (FPL `do`). `roster_locked`: a player in the claim
        was in a trade under review or in a trade that counts from the next
        gameweek, or the player to drop was locked (added since the last
        run).
      type: string
      enum: [player_in_unavailable, player_out_unavailable, roster_locked]
    ClaimApproved:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          const: approved
    ClaimDenied:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          const: denied
        reason:
          $ref: '#/components/schemas/ClaimDeniedReason'
    ClaimResult:
      description: |
        Result of a waiver claim or free-agent move (FPL `a` = approved,
        `di`/`do` = denied). Discriminated on `outcome`.
      oneOf:
        - $ref: '#/components/schemas/ClaimApproved'
        - $ref: '#/components/schemas/ClaimDenied'
      discriminator:
        propertyName: outcome
        mapping:
          approved: '#/components/schemas/ClaimApproved'
          denied: '#/components/schemas/ClaimDenied'
    WaiverTransaction:
      type: object
      required:
        [id, kind, occurredAt, gameweek, team, playerIn, playerOut, result, priority, sourceState]
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        kind:
          type: string
          const: waiver
        occurredAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        team:
          $ref: '#/components/schemas/TeamRef'
        playerIn:
          $ref: '#/components/schemas/PlayerRef'
        playerOut:
          $ref: '#/components/schemas/PlayerRef'
        result:
          $ref: '#/components/schemas/ClaimResult'
        priority:
          type: integer
          minimum: 1
          description: The team's waiver priority when the claim ran (1 = first).
        sourceState:
          type: [string, 'null']
          description: Imported leagues only; the raw provider result code (FPL `a`, `di`, `do`), for support only. Never branch on it.
    FreeAgentTransaction:
      type: object
      required: [id, kind, occurredAt, gameweek, team, playerIn, playerOut, result, sourceState]
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        kind:
          type: string
          const: free_agent
        occurredAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        team:
          $ref: '#/components/schemas/TeamRef'
        playerIn:
          $ref: '#/components/schemas/PlayerRef'
        playerOut:
          $ref: '#/components/schemas/PlayerRef'
        result:
          $ref: '#/components/schemas/ClaimResult'
        sourceState:
          type: [string, 'null']
          description: Imported leagues only; the raw provider result code, for support only. Never branch on it.
    TradeStatus:
      description: |
        Open enum. `offered`: waiting for the receiving team. `accepted`:
        accepted and waiting to execute (players in a locked gameweek move
        when it unlocks). `in_review`: accepted, inside the review window.
        `processed`: players moved. `declined`: the receiving team said no.
        `withdrawn`: the offering team took it back. `expired`: not
        answered before the next waiver run. `vetoed`: blocked by the
        commissioner or a league vote. `failed`: could not execute (a player
        left a roster first). `unknown`: an imported state we do not
        recognise.
      type: string
      enum:
        [
          offered,
          accepted,
          in_review,
          processed,
          declined,
          withdrawn,
          expired,
          vetoed,
          failed,
          unknown,
        ]
    TradeTransaction:
      type: object
      required:
        [
          id,
          kind,
          occurredAt,
          gameweek,
          status,
          sourceState,
          offeringTeam,
          receivingTeam,
          offered,
          requested,
        ]
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        kind:
          type: string
          const: trade
        occurredAt:
          type: string
          format: date-time
          description: When the trade was processed or vetoed.
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        status:
          $ref: '#/components/schemas/TradeStatus'
        sourceState:
          type: [string, 'null']
          description: Imported leagues only; the raw provider state code (FPL `p`, `v`), for support only. Never branch on it.
        offeringTeam:
          $ref: '#/components/schemas/TeamRef'
        receivingTeam:
          $ref: '#/components/schemas/TeamRef'
        offered:
          type: array
          description: Players moving from the offering team to the receiving team.
          minItems: 1
          items:
            $ref: '#/components/schemas/PlayerRef'
        requested:
          type: array
          description: Players moving from the receiving team to the offering team.
          minItems: 1
          items:
            $ref: '#/components/schemas/PlayerRef'
    DraftAutopickTransaction:
      description: |
        A draft pick made by autopick because the team's pick clock ran out
        (`DraftPick.missedClock`). `gameweek` is the league's first.
      type: object
      required: [id, kind, occurredAt, gameweek, team, player, overall, round, method]
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        kind:
          type: string
          const: draft_autopick
        occurredAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        team:
          $ref: '#/components/schemas/TeamRef'
        player:
          $ref: '#/components/schemas/PlayerRef'
        overall:
          type: integer
          minimum: 1
        round:
          type: integer
          minimum: 1
        method:
          $ref: '#/components/schemas/DraftPickMethod'
    Transaction:
      description: One feed entry. Discriminated on `kind`.
      oneOf:
        - $ref: '#/components/schemas/WaiverTransaction'
        - $ref: '#/components/schemas/FreeAgentTransaction'
        - $ref: '#/components/schemas/TradeTransaction'
        - $ref: '#/components/schemas/DraftAutopickTransaction'
      discriminator:
        propertyName: kind
        mapping:
          waiver: '#/components/schemas/WaiverTransaction'
          free_agent: '#/components/schemas/FreeAgentTransaction'
          trade: '#/components/schemas/TradeTransaction'
          draft_autopick: '#/components/schemas/DraftAutopickTransaction'
    TransactionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        meta:
          $ref: '#/components/schemas/PageMeta'
    # ---------------------------------------------------------------- problems
    ProblemError:
      description: One broken rule in a 422.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code, for example a `LineupViolationCode`,
            `position_mismatch` or `too_long`.
        message:
          type: string
          description: Human-readable, safe to show.
        field:
          type: string
          description: JSON pointer into the request body, when it applies.
        playerId:
          $ref: '#/components/schemas/PlayerId'
    # ---------------------------------------------------------------- auth & users
    AuthProvider:
      description: Open enum.
      type: string
      enum: [apple, google, email]
    UserRef:
      description: Another user, as other league members see them.
      type: object
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
    User:
      description: The signed-in user. Only ever returned to that user.
      type: object
      required: [id, displayName, email, avatarColor, authProviders, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
          maxLength: 32
        email:
          description: Null when the provider did not share one. May be an Apple private relay address.
          type: [string, 'null']
          format: email
        avatarColor:
          description: Background of the initials avatar. No photos.
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
        authProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
        createdAt:
          type: string
          format: date-time
      example:
        id: usr_01k7m2xq8z0000000000000001
        displayName: Sam P.
        email: sam@example.com
        avatarColor: '#2f6fed'
        authProviders: [email]
        createdAt: '2026-08-01T09:00:00Z'
    UserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 32
        avatarColor:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
    Session:
      type: object
      required: [accessToken, tokenType, expiresAt, refreshToken, refreshExpiresAt, user, isNewUser]
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`. Opaque.'
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Single use; store it in the platform keychain, never in web storage readable by scripts.
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        isNewUser:
          type: boolean
          description: True on the first sign-in; the app then asks for a display name.
    SessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/Meta'
    AppleSignInRequest:
      type: object
      required: [identityToken, authorizationCode, nonce]
      additionalProperties: false
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 8192
        authorizationCode:
          description: |
            Apple's single-use authorization code. The server exchanges it
            for a refresh token, kept encrypted, which it revokes when the
            account is deleted.
          type: string
          minLength: 1
          maxLength: 1024
        nonce:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Required. The raw, single-use random nonce whose SHA-256 was sent
            to Apple; the identity token must carry that hash, so a stolen
            token cannot be replayed.
        givenName:
          type: string
          maxLength: 64
        familyName:
          type: string
          maxLength: 64
    GoogleSignInRequest:
      type: object
      required: [idToken]
      additionalProperties: false
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 8192
        nonce:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            The nonce the client asked Google to put in the ID token. When
            sent, the token must carry it (raw or as its SHA-256 hex).
    EmailSignInRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        next:
          type: string
          maxLength: 200
          # Path segments of URL-safe characters, none starting with a dot:
          # no scheme, host, `//`, backslash, query or `..`.
          pattern: '^(/[A-Za-z0-9_~-][A-Za-z0-9_.~-]*)+$'
          description: |
            Where the app goes after signing in, carried in the emailed
            link: a path inside the app, like `/join/K7QM2XRP4D`. Never a
            URL, so the link cannot redirect off-site.
    EmailSignInStarted:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working (15 minutes).
    EmailSignInStartedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/EmailSignInStarted'
        meta:
          $ref: '#/components/schemas/Meta'
    EmailVerifyRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
    EmailCodeVerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6-digit code from the sign-in email.
    ClaimSignInRequest:
      type: object
      required: [code, displayName]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/InviteCode'
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          description: The new account's display name (trimmed; 1 to 32 characters).
    ClaimSignIn:
      type: object
      required: [session, membership]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        membership:
          $ref: '#/components/schemas/Membership'
    ClaimSignInResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ClaimSignIn'
        meta:
          $ref: '#/components/schemas/Meta'
    SignInLinkRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/SignInLinkCode'
    SignInLinkCode:
      description: A sign-in link's code (43 URL-safe characters).
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    SignInLinkSession:
      type: object
      required: [session, leagueId]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        leagueId:
          $ref: '#/components/schemas/LeagueId'
    SignInLinkSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SignInLinkSession'
        meta:
          $ref: '#/components/schemas/Meta'
    SeatSignInLink:
      type: object
      required: [team, owner, url, expiresAt]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        owner:
          $ref: '#/components/schemas/UserRef'
        url:
          description: The link to send the manager. It works once.
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    SeatSignInLinkResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SeatSignInLink'
        meta:
          $ref: '#/components/schemas/Meta'
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 256
    # ---------------------------------------------------------------- league management
    LeagueSettingsInput:
      description: |
        Partial settings: send only what changes. Values follow
        `LeagueSettings`. Scoring, schedule, roster and lineup rules are
        fixed in v1 and cannot be sent. The server enforces every
        `minimum` and `maximum` below: out-of-range values answer 422
        `invalid-request` with one `errors` entry (code `out_of_range`) per
        value.
      type: object
      additionalProperties: false
      properties:
        teamCount:
          type: integer
          minimum: 2
          maximum: 20
        draft:
          type: object
          additionalProperties: false
          properties:
            pickTimerSeconds:
              type: integer
              minimum: 15
              maximum: 86400
            startsAt:
              type: [string, 'null']
              format: date-time
        trades:
          type: object
          additionalProperties: false
          properties:
            review:
              $ref: '#/components/schemas/TradeReview'
            reviewHours:
              type: integer
              minimum: 0
              maximum: 72
            vetoThreshold:
              type: number
              minimum: 0
              maximum: 1
            deadlineGameweek:
              type: [integer, 'null']
              minimum: 1
              maximum: 38
        waivers:
          type: object
          additionalProperties: false
          properties:
            order:
              $ref: '#/components/schemas/WaiverOrderRule'
        startGameweek:
          $ref: '#/components/schemas/GameweekNumber'
    CommissionerTransfer:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
    LeagueCreate:
      type: object
      required: [name, teamCount, teamName]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 40
        teamCount:
          type: integer
          minimum: 2
          maximum: 20
        teamName:
          description: The commissioner's own team.
          type: string
          minLength: 1
          maxLength: 32
        settings:
          $ref: '#/components/schemas/LeagueSettingsInput'
      example:
        name: Office League
        teamCount: 10
        teamName: Sunday League Heroes
        settings:
          draft: { pickTimerSeconds: 90 }
          trades: { review: league_vote, reviewHours: 24, vetoThreshold: 0.5 }
    LeagueUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 40
        settings:
          $ref: '#/components/schemas/LeagueSettingsInput'
    League:
      description: A league's identity and settings, without the live data in `LeagueHome`.
      type: object
      required: [league, settings, commissioner, viewer, createdAt]
      properties:
        league:
          $ref: '#/components/schemas/LeagueSummary'
        settings:
          $ref: '#/components/schemas/LeagueSettings'
        commissioner:
          $ref: '#/components/schemas/UserRef'
        viewer:
          $ref: '#/components/schemas/LeagueViewer'
        createdAt:
          type: string
          format: date-time
    LeagueResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/League'
        meta:
          $ref: '#/components/schemas/Meta'
    MyLeague:
      description: One row of the home screen's league list.
      type: object
      required: [league, team, role, record, currentMatchup, draftStartsAt]
      properties:
        league:
          $ref: '#/components/schemas/LeagueSummary'
        team:
          $ref: '#/components/schemas/TeamRef'
        role:
          $ref: '#/components/schemas/LeagueRole'
        record:
          description: Null before the first gameweek is complete.
          oneOf:
            - $ref: '#/components/schemas/Record'
            - type: 'null'
        currentMatchup:
          description: This gameweek's matchup, with live scores; null before the schedule exists.
          oneOf:
            - $ref: '#/components/schemas/MatchupSummary'
            - type: 'null'
        draftStartsAt:
          type: [string, 'null']
          format: date-time
    MyLeagueListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyLeague'
        meta:
          $ref: '#/components/schemas/Meta'
    Member:
      type: object
      required: [user, team, role, joinedAt]
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        team:
          $ref: '#/components/schemas/TeamRef'
        role:
          $ref: '#/components/schemas/LeagueRole'
        joinedAt:
          type: string
          format: date-time
    MemberListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        meta:
          $ref: '#/components/schemas/Meta'
    Invite:
      type: object
      required: [id, code, url, createdAt, expiresAt, maxUses, uses, revoked, claimTeam]
      properties:
        id:
          $ref: '#/components/schemas/InviteId'
        code:
          $ref: '#/components/schemas/InviteCode'
        url:
          type: string
          format: uri
          description: Shareable link that opens the app (or the web app) on the invite.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        maxUses:
          type: [integer, 'null']
          minimum: 1
        uses:
          type: integer
          minimum: 0
        revoked:
          type: boolean
        claimTeam:
          description: A claim link's seat (an imported league's team without a manager); null for an ordinary invite.
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
    InviteCreate:
      type: object
      additionalProperties: false
      properties:
        maxUses:
          type: integer
          minimum: 1
          maximum: 20
        expiresInHours:
          description: How long the invite works. Omitted, one week (168).
          type: integer
          minimum: 1
          maximum: 720
    InviteResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Invite'
        meta:
          $ref: '#/components/schemas/Meta'
    InviteListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
        meta:
          $ref: '#/components/schemas/Meta'
    InvitePreview:
      type: object
      required:
        [
          code,
          leagueId,
          leagueName,
          season,
          status,
          teamCount,
          memberCount,
          commissionerName,
          expiresAt,
          joinable,
          claimTeam,
          claimSignIn,
        ]
      properties:
        code:
          $ref: '#/components/schemas/InviteCode'
        leagueId:
          $ref: '#/components/schemas/LeagueId'
          description: |
            Lets a signed-in member see they are already in the league and
            open it. Reading the league itself still needs membership.
        leagueName:
          type: string
        season:
          $ref: '#/components/schemas/Season'
        status:
          $ref: '#/components/schemas/LeagueStatus'
        teamCount:
          type: integer
        memberCount:
          type: integer
        commissionerName:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
        joinable:
          type: boolean
          description: |
            False when no place is left: before the draft every place has a
            team, after it no team is an open seat (an unclaimed seat's claim
            link is joinable).
        claimTeam:
          description: The seat a claim link gives; null for an ordinary invite.
          oneOf:
            - $ref: '#/components/schemas/InviteClaimTeam'
            - type: 'null'
        claimSignIn:
          type: boolean
          description: |
            True when a signed-out person may claim this seat with only a
            display name (`POST /v1/auth/claim`): a claim link on a server
            with `CLAIM_LINK_SIGNIN` on. False for ordinary invites, which
            need sign-in.
    InviteClaimTeam:
      type: object
      required: [teamName, fplManagerName]
      properties:
        teamName:
          type: string
        fplManagerName:
          type: string
    InvitePreviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InvitePreview'
        meta:
          $ref: '#/components/schemas/Meta'
    InviteAccept:
      type: object
      additionalProperties: false
      properties:
        teamName:
          description: |
            Required for an ordinary invite (an open seat taken over after the
            draft is renamed to it); ignored for a claim link (the seat keeps
            its FPL name).
          type: string
          minLength: 1
          maxLength: 32
    Membership:
      type: object
      required: [league, team, role]
      properties:
        league:
          $ref: '#/components/schemas/LeagueSummary'
        team:
          $ref: '#/components/schemas/TeamRef'
        role:
          $ref: '#/components/schemas/LeagueRole'
    MembershipResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Membership'
        meta:
          $ref: '#/components/schemas/Meta'
    TeamUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
    TeamRefResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TeamRef'
        meta:
          $ref: '#/components/schemas/Meta'
    StandingsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StandingRow'
        meta:
          $ref: '#/components/schemas/Meta'
    ScheduledMatchup:
      type: object
      required: [id, gameweek, home, away]
      properties:
        id:
          $ref: '#/components/schemas/MatchupId'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        home:
          $ref: '#/components/schemas/Opponent'
        away:
          $ref: '#/components/schemas/Opponent'
    ScheduleWeek:
      type: object
      required: [gameweek, matchups]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        matchups:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledMatchup'
    ScheduleResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleWeek'
        meta:
          $ref: '#/components/schemas/Meta'
    ClubListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClubRef'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- status page
    StatusAttentionItem:
      description: Something the caller should act on, most urgent first.
      type: object
      required: [kind, severity, message, count, gameweek]
      properties:
        kind:
          description: |
            Open enum. `trade_offers`: offers waiting for the caller.
            `starters_without_fixture`: starters whose club does not play in
            `gameweek`. `injured_starters`: starters flagged injured,
            suspended or doubtful. `pending_waivers`: the caller's claims
            waiting for the next run.
          type: string
          enum: [trade_offers, starters_without_fixture, injured_starters, pending_waivers]
        severity:
          description: Open enum. `critical` is drawn as a stop sign.
          type: string
          enum: [info, warning, critical]
        message:
          type: string
          examples: ['2 starters have no game in GW 8']
        count:
          type: integer
          minimum: 1
        gameweek:
          oneOf:
            - $ref: '#/components/schemas/GameweekNumber'
            - type: 'null'
    StatusFixtureWeek:
      description: A club's fixtures in one gameweek. Empty in a blank, two in a double.
      type: object
      required: [gameweek, fixtures]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        fixtures:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/UpcomingFixture'
    StatusAvailablePlayer:
      type: object
      required: [player, rosterStatus, waiverClearsAt, form, upcoming]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        rosterStatus:
          $ref: '#/components/schemas/RosterStatus'
        waiverClearsAt:
          type: [string, 'null']
          format: date-time
        form:
          type: [number, 'null']
          description: As `PlayerListItem.form`.
        upcoming:
          type: array
          description: The next three gameweeks, in order.
          maxItems: 3
          items:
            $ref: '#/components/schemas/StatusFixtureWeek'
    StatusFlaggedPlayer:
      type: object
      required: [player, owner, chanceOfPlaying]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        owner:
          oneOf:
            - $ref: '#/components/schemas/TeamRef'
            - type: 'null'
          description: The team that owns the player in this league; null otherwise.
        chanceOfPlaying:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Percent chance of playing next; null when unknown.
    LeagueStatusPage:
      type: object
      required: [gameweek, rankChange, attention, topAvailable, injuries, transactionPhase]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        transactionPhase:
          $ref: '#/components/schemas/TransactionPhase'
        rankChange:
          type: integer
          description: |
            Places the caller's team moved in the table with the last
            completed gameweek. Positive is up, negative down.
        attention:
          type: array
          items:
            $ref: '#/components/schemas/StatusAttentionItem'
        topAvailable:
          type: array
          description: |
            The ten best available (free agent or waivers) players by form
            in each position, best first. The first ten are the overall
            top ten.
          maxItems: 40
          items:
            $ref: '#/components/schemas/StatusAvailablePlayer'
        injuries:
          type: array
          description: |
            Every flagged player in the game (availability other than
            `available`), out before doubtful, then by name.
          items:
            $ref: '#/components/schemas/StatusFlaggedPlayer'
    LeagueStatusPageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LeagueStatusPage'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- awards
    AwardStats:
      description: A player's gameweek numbers that awards rank on.
      type: object
      required: [points, bonus, bps, goals, assists, defensiveContribution, cleanSheets, minutes]
      properties:
        points:
          type: integer
        bonus:
          type: integer
          minimum: 0
        bps:
          type: integer
          description: Bonus points system score.
        goals:
          type: integer
          minimum: 0
        assists:
          type: integer
          minimum: 0
        defensiveContribution:
          type: integer
          minimum: 0
          description: Defensive contribution count (clearances, blocks, interceptions, tackles; recoveries for midfielders).
        cleanSheets:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
    AwardPlayer:
      type: object
      required: [player, stats]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        stats:
          $ref: '#/components/schemas/AwardStats'
    GameweekAwards:
      type: object
      required: [gameweek, state, playerOfTheWeek, teamOfTheWeek]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        state:
          $ref: '#/components/schemas/ScoreState'
        playerOfTheWeek:
          oneOf:
            - $ref: '#/components/schemas/AwardPlayer'
            - type: 'null'
        teamOfTheWeek:
          type: array
          description: Goalkeeper, defenders, midfielders, forwards; best first within each.
          maxItems: 11
          items:
            $ref: '#/components/schemas/AwardPlayer'
    GameweekAwardsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GameweekAwards'
        meta:
          $ref: '#/components/schemas/Meta'
    GameweekFixture:
      description: One Premier League fixture with its score.
      type: object
      required:
        [fixtureId, gameweek, kickoffAt, status, home, away, homeScore, awayScore, minute, period]
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        kickoffAt:
          description: Null while the kickoff has not been scheduled.
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/FixtureStatus'
        home:
          $ref: '#/components/schemas/ClubRef'
        away:
          $ref: '#/components/schemas/ClubRef'
        homeScore:
          description: Null before kickoff.
          type: [integer, 'null']
          minimum: 0
        awayScore:
          description: Null before kickoff.
          type: [integer, 'null']
          minimum: 0
        minute:
          description: |
            While live, the match minute: the most minutes any player in the
            fixture has played (upstream stops at 45 over half time and at
            90 in stoppage time). Null otherwise, or before upstream reports
            any minutes.
          type: [integer, 'null']
          minimum: 0
        period:
          description: While live, where the match is; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/MatchPeriod'
            - type: 'null'
    MatchPeriod:
      description: |
        Open enum. `half_time` is inferred: the minute has stood at 45 for
        more than 50 minutes after kickoff.
      type: string
      enum: [first_half, half_time, second_half]
    GameweekFixtureListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameweekFixture'
        meta:
          $ref: '#/components/schemas/Meta'
    FixtureDetail:
      description: One fixture's box score (`GET /v1/fixtures/{fixtureId}`).
      type: object
      required: [fixture, home, away]
      properties:
        fixture:
          $ref: '#/components/schemas/GameweekFixture'
        home:
          $ref: '#/components/schemas/FixtureSide'
        away:
          $ref: '#/components/schemas/FixtureSide'
    FixtureSide:
      description: One club's players in a fixture.
      type: object
      required: [club, players]
      properties:
        club:
          $ref: '#/components/schemas/ClubRef'
        players:
          type: array
          items:
            $ref: '#/components/schemas/FixturePlayer'
    FixturePlayer:
      description: One player's match in a fixture.
      type: object
      required: [player, minutes, points, bonusProvisional, stats, breakdown, owners]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        minutes:
          type: integer
          minimum: 0
        points:
          type: integer
          description: FPL points in this fixture, bonus included.
        bonusProvisional:
          type: boolean
          description: The bonus is projected from BPS, not confirmed yet.
        stats:
          $ref: '#/components/schemas/FixturePlayerStats'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/PointsLine'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/FixtureOwner'
    FixturePlayerStats:
      type: object
      required:
        - goalsScored
        - assists
        - ownGoals
        - yellowCards
        - redCards
        - saves
        - penaltiesSaved
        - penaltiesMissed
        - bonus
      properties:
        goalsScored:
          type: integer
          minimum: 0
        assists:
          type: integer
          minimum: 0
        ownGoals:
          type: integer
          minimum: 0
        yellowCards:
          type: integer
          minimum: 0
        redCards:
          type: integer
          minimum: 0
        saves:
          type: integer
          minimum: 0
        penaltiesSaved:
          type: integer
          minimum: 0
        penaltiesMissed:
          type: integer
          minimum: 0
        bonus:
          type: integer
          minimum: 0
    FixtureOwner:
      description: The team owning a player in one of the caller's leagues.
      type: object
      required: [leagueId, leagueName, team, mine]
      properties:
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        leagueName:
          type: string
        team:
          $ref: '#/components/schemas/TeamRef'
        mine:
          type: boolean
          description: The caller's own team.
    FixtureDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FixtureDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    PlayerOfTheWeek:
      type: object
      required: [gameweek, state, award]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        state:
          $ref: '#/components/schemas/ScoreState'
        award:
          $ref: '#/components/schemas/AwardPlayer'
    PlayerOfTheWeekListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlayerOfTheWeek'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- projections (ADR 0014)
    DifficultyRank:
      description: |
        The opponent's fixture difficulty for the player's position: 1
        (concedes least to it: hardest) to 20 (concedes most: easiest).
      type: integer
      minimum: 1
      maximum: 20
    ClubDifficulty:
      type: object
      required: [club, rank, pointsConceded, matches]
      properties:
        club:
          $ref: '#/components/schemas/ClubRef'
        rank:
          $ref: '#/components/schemas/DifficultyRank'
        pointsConceded:
          type: integer
          description: Points the position scored against the club in the window.
        matches:
          type: integer
          minimum: 1
          description: The club's matches in the window.
    PositionDifficulty:
      type: object
      required: [position, clubs]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        clubs:
          type: array
          description: Hardest first.
          items:
            $ref: '#/components/schemas/ClubDifficulty'
    FixtureDifficulty:
      type: object
      required: [formGameweek, recentGameweeks, positions]
      properties:
        formGameweek:
          $ref: '#/components/schemas/GameweekNumber'
        recentGameweeks:
          type: array
          description: The completed gameweeks ranked over, oldest first (up to six).
          items:
            $ref: '#/components/schemas/GameweekNumber'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionDifficulty'
    FixtureDifficultyResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FixtureDifficulty'
        meta:
          $ref: '#/components/schemas/Meta'
    FixtureProjection:
      type: object
      required: [fixtureId, opponent, isHome, difficultyRank, factor]
      properties:
        fixtureId:
          $ref: '#/components/schemas/FixtureId'
        opponent:
          $ref: '#/components/schemas/ClubRef'
        isHome:
          type: boolean
        difficultyRank:
          description: Null when the opponent has no match in the window.
          oneOf:
            - $ref: '#/components/schemas/DifficultyRank'
            - type: 'null'
        factor:
          type: number
          description: 0.8 + 0.4 × (rank − 1) / 19; 1 when unranked.
    PlayerProjection:
      type: object
      required: [playerId, form, expected, fixtures]
      properties:
        playerId:
          $ref: '#/components/schemas/PlayerId'
        form:
          type: [number, 'null']
          description: As `PlayerListItem.form`; null before any gameweek is completed.
        expected:
          type: [number, 'null']
          description: Form × the sum of `fixtures[].factor`, one decimal. Null when form is.
        fixtures:
          type: array
          description: His club's matches in the gameweek; empty in a blank.
          maxItems: 3
          items:
            $ref: '#/components/schemas/FixtureProjection'
    LineupBasis:
      description: |
        Open enum. `lineup`: the team's lineup for the gameweek (yours, or
        anyone's once the deadline has passed). `last_locked`: another
        team's before the deadline, from its last locked lineup.
      type: string
      enum: [lineup, last_locked]
    TeamProjection:
      type: object
      required: [team, expected, lineupBasis, starters]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        expected:
          type: [number, 'null']
          description: |
            The sum of the starters' `expected`, without auto-subs. Null
            when no starter has one.
        lineupBasis:
          $ref: '#/components/schemas/LineupBasis'
        starters:
          type: array
          description: The XI the sum is over.
          maxItems: 11
          items:
            $ref: '#/components/schemas/PlayerId'
    OddsMode:
      description: |
        Open enum. `pre_game`: no match of the gameweek has kicked off.
        `live`: points so far plus resampled matches still to play.
        `final`: every match is over; the odds are the result.
      type: string
      enum: [pre_game, live, final]
    WinOdds:
      description: Chances that sum to 1.
      type: object
      required: [home, draw, away]
      properties:
        home:
          type: number
          minimum: 0
          maximum: 1
        draw:
          type: number
          minimum: 0
          maximum: 1
        away:
          type: number
          minimum: 0
          maximum: 1
    MatchupOdds:
      type: object
      required: [matchupId, homeTeamId, awayTeamId, mode, odds, samples]
      properties:
        matchupId:
          $ref: '#/components/schemas/MatchupId'
        homeTeamId:
          description: Null for the league-average side.
          oneOf:
            - $ref: '#/components/schemas/TeamId'
            - type: 'null'
        awayTeamId:
          description: Null for the league-average side.
          oneOf:
            - $ref: '#/components/schemas/TeamId'
            - type: 'null'
        mode:
          $ref: '#/components/schemas/OddsMode'
        odds:
          description: Null when no gameweek is completed yet (no scores to resample).
          oneOf:
            - $ref: '#/components/schemas/WinOdds'
            - type: 'null'
        samples:
          type: integer
          minimum: 0
          description: Plays simulated; 0 when final or null.
    LeagueProjections:
      type: object
      required: [gameweek, formGameweek, recentGameweeks, players, teams, matchups]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        formGameweek:
          $ref: '#/components/schemas/GameweekNumber'
        recentGameweeks:
          type: array
          description: The completed gameweeks win odds resample, oldest first (up to six).
          items:
            $ref: '#/components/schemas/GameweekNumber'
        players:
          type: array
          description: Every player on a roster in the gameweek.
          items:
            $ref: '#/components/schemas/PlayerProjection'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamProjection'
        matchups:
          type: array
          items:
            $ref: '#/components/schemas/MatchupOdds'
    LeagueProjectionsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LeagueProjections'
        meta:
          $ref: '#/components/schemas/Meta'
    StartSitWeek:
      type: object
      required: [gameweek, points, optimalPoints, accuracy]
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        points:
          type: integer
          description: The team's score, auto-subs included.
        optimalPoints:
          type: integer
          description: The best legal XI from the 15 by actual points.
        accuracy:
          type: [number, 'null']
          description: points / optimalPoints; null when optimalPoints ≤ 0.
    TeamStartSit:
      type: object
      required: [team, seasonAccuracy, gameweeks]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        seasonAccuracy:
          type: [number, 'null']
          description: Mean of the gameweeks' accuracies; null with none.
        gameweeks:
          type: array
          description: Completed gameweeks, oldest first.
          items:
            $ref: '#/components/schemas/StartSitWeek'
    StartSitResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamStartSit'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- end projections
    # ---------------------------------------------------------------- draft
    DraftStatus:
      description: |
        Open enum. `scheduled`: not started (start time may be null).
        `in_progress`: a pick clock is running. `paused`: by the
        commissioner. `complete`: every round is done; rosters exist.
      type: string
      enum: [scheduled, in_progress, paused, complete]
    DraftSlot:
      type: object
      required: [slot, team, autopick]
      properties:
        slot:
          type: integer
          minimum: 1
          description: Position in round 1 (snake rounds reverse it).
        team:
          $ref: '#/components/schemas/TeamRef'
        autopick:
          type: boolean
          description: Picks for this team are made automatically.
    DraftPickMethod:
      description: |
        Open enum. `manual`: the manager picked. `queue`: autopick from the
        team's queue. `rank`: autopick by draft rank. `commissioner`: the
        commissioner picked for the team.
      type: string
      enum: [manual, queue, rank, commissioner]
    DraftPick:
      type: object
      required: [id, overall, round, pickInRound, team, player, method, pickedAt, missedClock]
      properties:
        id:
          $ref: '#/components/schemas/DraftPickId'
        overall:
          type: integer
          minimum: 1
        round:
          type: integer
          minimum: 1
        pickInRound:
          type: integer
          minimum: 1
        team:
          $ref: '#/components/schemas/TeamRef'
        player:
          $ref: '#/components/schemas/PlayerRef'
        method:
          $ref: '#/components/schemas/DraftPickMethod'
        pickedAt:
          type: string
          format: date-time
        missedClock:
          type: boolean
          description: |
            The team's pick clock ran out and autopick chose this player
            (`method` is `queue` or `rank`). The draft room says so, and the
            pick joins the activity feed as a `draft_autopick` entry.
    DraftClock:
      description: The pick on the clock.
      type: object
      required: [overall, round, pickInRound, team, startedAt, deadlineAt]
      properties:
        overall:
          type: integer
          minimum: 1
        round:
          type: integer
          minimum: 1
        pickInRound:
          type: integer
          minimum: 1
        team:
          $ref: '#/components/schemas/TeamRef'
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          description: When autopick takes over. Null while paused.
          type: [string, 'null']
          format: date-time
    Draft:
      type: object
      required:
        [
          id,
          status,
          type,
          rounds,
          pickTimerSeconds,
          startsAt,
          order,
          picks,
          currentPick,
          completedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/DraftId'
        status:
          $ref: '#/components/schemas/DraftStatus'
        type:
          description: Open enum.
          type: string
          enum: [snake]
        rounds:
          type: integer
          description: One per squad place (15).
        pickTimerSeconds:
          type: integer
        startsAt:
          type: [string, 'null']
          format: date-time
        order:
          type: array
          description: Round 1 order. Empty until set or randomised.
          items:
            $ref: '#/components/schemas/DraftSlot'
        picks:
          type: array
          description: Every pick so far, by `overall`. The board is order x rounds.
          items:
            $ref: '#/components/schemas/DraftPick'
        currentPick:
          oneOf:
            - $ref: '#/components/schemas/DraftClock'
            - type: 'null'
        completedAt:
          type: [string, 'null']
          format: date-time
    DraftResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Draft'
        meta:
          $ref: '#/components/schemas/Meta'
    DraftUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        startsAt:
          type: [string, 'null']
          format: date-time
        pickTimerSeconds:
          type: integer
          minimum: 15
          maximum: 86400
        order:
          type: array
          description: Every team id once, in round 1 order.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TeamId'
        randomizeOrder:
          type: boolean
          description: True to shuffle the order. Do not send with `order`.
    DraftPickRequest:
      type: object
      required: [playerId]
      additionalProperties: false
      properties:
        playerId:
          $ref: '#/components/schemas/PlayerId'
    DraftPickResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DraftPick'
        meta:
          $ref: '#/components/schemas/Meta'
    DraftQueueItem:
      type: object
      required: [player, draftRank]
      properties:
        player:
          $ref: '#/components/schemas/PlayerRef'
        draftRank:
          type: integer
          minimum: 1
    DraftQueue:
      type: object
      required: [team, autopick, autopickOnTimeout, players]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        autopick:
          type: boolean
          description: Picks are made at once, from the queue and then by rank.
        autopickOnTimeout:
          type: boolean
          description: |
            "Autopick when my clock runs out", on by default. A missed clock
            always picks (queue, then rank) so the draft never stalls. When
            on, that also turns `autopick` on for the rest of the draft; when
            off, `autopick` stays off and the next pick gets a full clock.
        players:
          type: array
          description: In the order autopick tries them. Never contains drafted players.
          items:
            $ref: '#/components/schemas/DraftQueueItem'
    DraftQueueResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DraftQueue'
        meta:
          $ref: '#/components/schemas/Meta'
    DraftQueueUpdate:
      type: object
      required: [playerIds]
      additionalProperties: false
      properties:
        playerIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerId'
    DraftAutopickUpdate:
      description: Send either or both.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Autopick now, from the queue and then by rank.
        onTimeout:
          type: boolean
          description: |
            "Autopick when my clock runs out" (`DraftQueue.autopickOnTimeout`).
    # ---------------------------------------------------------------- lineups
    LineupViolationCode:
      description: Open enum. Why a lineup is illegal.
      type: string
      enum:
        - wrong_starter_count
        - wrong_bench_count
        - too_few_goalkeepers
        - too_many_goalkeepers
        - too_few_defenders
        - too_many_defenders
        - too_few_midfielders
        - too_many_midfielders
        - too_few_forwards
        - too_many_forwards
        - bench_goalkeeper_not_first
        - player_not_on_roster
        - player_missing
        - duplicate_player
    LineupEntry:
      type: object
      required: [slot, player, fixtures]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 15
          description: 1-11 starters, 12-15 bench in auto-sub order. Slot 12 is the bench keeper.
        player:
          $ref: '#/components/schemas/PlayerRef'
        fixtures:
          type: array
          description: The player's club's fixtures in this gameweek (two in a double, none in a blank).
          maxItems: 3
          items:
            $ref: '#/components/schemas/UpcomingFixture'
        points:
          type: integer
          description: |
            Points this gameweek across all fixtures. Present once the
            gameweek has started (the lineup is locked); absent before.
        autoSub:
          $ref: '#/components/schemas/AutoSubState'
        bonusProvisional:
          type: boolean
          description: True while any of the player's bonus points are projected from BPS.
        season:
          $ref: '#/components/schemas/LineupEntrySeason'
        chanceOfPlaying:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Percent chance of playing next, as `StatusFlaggedPlayer`: 0 for a
            player who is out, the figure in the news for a doubtful one, null
            when unknown or available.
    LineupEntrySeason:
      type: object
      description: The player's season so far, for the roster row's stat line.
      required: [form, totalPoints, appearances, clubMatches]
      properties:
        form:
          type: [number, 'null']
          description: As `PlayerListItem.form`.
        totalPoints:
          type: integer
          description: Season total.
        appearances:
          type: integer
          minimum: 0
          description: Matches he played in (minutes, or a card from the bench), FPL's sense.
        clubMatches:
          type: integer
          minimum: 0
          description: |
            Matches his club has finished this season, the most he could have
            played. A player who changed clubs can have more appearances.
    Lineup:
      type: object
      required: [team, gameweek, locked, locksAt, formation, starters, bench, updatedAt]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        locked:
          type: boolean
          description: True once the gameweek deadline has passed.
        locksAt:
          type: string
          format: date-time
          description: The gameweek deadline (first kickoff minus 90 minutes).
        formation:
          type: string
          examples: ['4-4-2']
        totalPoints:
          type: integer
          description: |
            Once the gameweek has started: the XI's points with auto-subs
            applied as they stand. Absent before.
        benchPoints:
          type: integer
          description: Once the gameweek has started, bench points that do not count.
        scoreState:
          $ref: '#/components/schemas/ScoreState'
        starters:
          type: array
          minItems: 11
          maxItems: 11
          items:
            $ref: '#/components/schemas/LineupEntry'
        bench:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/LineupEntry'
        updatedAt:
          type: string
          format: date-time
    LineupResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Lineup'
        meta:
          $ref: '#/components/schemas/Meta'
    LineupUpdate:
      type: object
      required: [gameweek, starters, bench]
      additionalProperties: false
      properties:
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        starters:
          type: array
          description: Slots 1-11 in order.
          minItems: 11
          maxItems: 11
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerId'
        bench:
          type: array
          description: Slots 12-15 in auto-sub order; the first is the backup goalkeeper.
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerId'
    # ---------------------------------------------------------------- waivers
    WaiverPriorityRow:
      type: object
      required: [rank, team]
      properties:
        rank:
          type: integer
          minimum: 1
          description: 1 = first claim.
        team:
          $ref: '#/components/schemas/TeamRef'
    WaiverState:
      type: object
      required: [type, order, nextRunGameweek, nextRunAt, lastRunAt, priority]
      properties:
        type:
          description: Open enum.
          type: string
          enum: [rolling_priority]
        order:
          $ref: '#/components/schemas/WaiverOrderRule'
        nextRunGameweek:
          description: The gameweek of the next waiver run; null after the last one.
          oneOf:
            - $ref: '#/components/schemas/GameweekNumber'
            - type: 'null'
        nextRunAt:
          type: [string, 'null']
          format: date-time
          description: The next waiver run (gameweek deadline minus 24 hours).
        lastRunAt:
          type: [string, 'null']
          format: date-time
        priority:
          type: array
          items:
            $ref: '#/components/schemas/WaiverPriorityRow'
    WaiverStateResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WaiverState'
        meta:
          $ref: '#/components/schemas/Meta'
    WaiverClaimStatus:
      description: |
        Open enum. `pending`: waiting for the next run. `won`: the player
        joined. `lost`: see `failureReason`. `cancelled`: by the manager.
      type: string
      enum: [pending, won, lost, cancelled]
    WaiverClaimFailure:
      description: |
        Open enum. `player_in_unavailable`: another team with higher
        priority claimed the player first. `player_out_unavailable`: the
        player to drop had already left the squad (an earlier claim or a
        trade). `roster_locked`: a player in the claim is in a trade under
        review or in a trade that counts from the next gameweek, or the
        player to drop was locked (added since the last run).
      type: string
      enum: [player_in_unavailable, player_out_unavailable, roster_locked]
    WaiverClaim:
      type: object
      required:
        [
          id,
          team,
          add,
          drop,
          order,
          status,
          failureReason,
          gameweek,
          processAt,
          processedAt,
          createdAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/WaiverClaimId'
        team:
          $ref: '#/components/schemas/TeamRef'
        add:
          $ref: '#/components/schemas/PlayerRef'
        drop:
          $ref: '#/components/schemas/PlayerRef'
        order:
          type: integer
          minimum: 1
          description: The team's own preference among its pending claims.
        status:
          $ref: '#/components/schemas/WaiverClaimStatus'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/WaiverClaimFailure'
            - type: 'null'
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        processAt:
          type: string
          format: date-time
        processedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    WaiverClaimResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WaiverClaim'
        meta:
          $ref: '#/components/schemas/Meta'
    WaiverClaimListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WaiverClaim'
        meta:
          $ref: '#/components/schemas/Meta'
    WaiverClaimCreate:
      type: object
      required: [addPlayerId, dropPlayerId]
      additionalProperties: false
      properties:
        addPlayerId:
          $ref: '#/components/schemas/PlayerId'
        dropPlayerId:
          $ref: '#/components/schemas/PlayerId'
    WaiverClaimUpdate:
      type: object
      required: [dropPlayerId]
      additionalProperties: false
      properties:
        dropPlayerId:
          $ref: '#/components/schemas/PlayerId'
    WaiverClaimOrder:
      type: object
      required: [claimIds]
      additionalProperties: false
      properties:
        claimIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/WaiverClaimId'
    FreeAgentMoveRequest:
      type: object
      required: [addPlayerId, dropPlayerId]
      additionalProperties: false
      properties:
        addPlayerId:
          $ref: '#/components/schemas/PlayerId'
        dropPlayerId:
          $ref: '#/components/schemas/PlayerId'
    FreeAgentMoveResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FreeAgentTransaction'
        meta:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- trades
    TradeVote:
      description: Open enum.
      type: string
      enum: [veto, allow]
    TradeAction:
      description: Open enum. What the caller may do with a trade now.
      type: string
      enum: [accept, decline, withdraw, vote, review]
    TradeReviewState:
      type: object
      required: [mode, endsAt, vetoVotes, allowVotes, votesNeeded, myVote, decidedBy]
      properties:
        mode:
          $ref: '#/components/schemas/TradeReview'
        endsAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the review window closes. Null for a trade pending on FPL
            in a league imported from it: FPL processes or vetoes it, and
            the next re-sync applies what it decided.
        vetoVotes:
          type: integer
          minimum: 0
        allowVotes:
          type: integer
          minimum: 0
        votesNeeded:
          type: [integer, 'null']
          minimum: 1
          description: '`league_vote` only: veto votes that block the trade.'
        myVote:
          oneOf:
            - $ref: '#/components/schemas/TradeVote'
            - type: 'null'
        decidedBy:
          description: The commissioner who approved or vetoed, if one did.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    TradeFailure:
      type: string
      description: |
        Open enum. Why a trade could not execute. `league_resynced`: the
        commissioner re-synced the imported league from FPL while it was open.
      enum: [player_no_longer_on_roster, roster_invalid, league_resynced]
    Trade:
      type: object
      required:
        - id
        - status
        - offeringTeam
        - receivingTeam
        - offered
        - requested
        - message
        - createdAt
        - expiresAt
        - respondedAt
        - review
        - processedAt
        - effectiveGameweek
        - failureReason
        - viewerActions
      properties:
        id:
          $ref: '#/components/schemas/TradeId'
        status:
          $ref: '#/components/schemas/TradeStatus'
        offeringTeam:
          $ref: '#/components/schemas/TeamRef'
        receivingTeam:
          $ref: '#/components/schemas/TeamRef'
        offered:
          type: array
          description: Players moving from the offering team to the receiving team.
          minItems: 1
          items:
            $ref: '#/components/schemas/PlayerRef'
        requested:
          type: array
          description: Players moving from the receiving team to the offering team.
          minItems: 1
          items:
            $ref: '#/components/schemas/PlayerRef'
        message:
          type: [string, 'null']
          maxLength: 280
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: An `offered` trade expires then (the next waiver run).
        respondedAt:
          type: [string, 'null']
          format: date-time
        review:
          description: Set once accepted in a league with trade review.
          oneOf:
            - $ref: '#/components/schemas/TradeReviewState'
            - type: 'null'
        processedAt:
          type: [string, 'null']
          format: date-time
        effectiveGameweek:
          description: The first gameweek the players count for their new team.
          oneOf:
            - $ref: '#/components/schemas/GameweekNumber'
            - type: 'null'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/TradeFailure'
            - type: 'null'
        viewerActions:
          type: array
          items:
            $ref: '#/components/schemas/TradeAction'
    TradeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Trade'
        meta:
          $ref: '#/components/schemas/Meta'
    TradeListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        meta:
          $ref: '#/components/schemas/PageMeta'
    TradeCreate:
      type: object
      required: [receivingTeamId, offeredPlayerIds, requestedPlayerIds]
      additionalProperties: false
      properties:
        receivingTeamId:
          $ref: '#/components/schemas/TeamId'
        offeredPlayerIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerId'
        requestedPlayerIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PlayerId'
        message:
          type: string
          maxLength: 280
    TradeVoteRequest:
      type: object
      required: [vote]
      additionalProperties: false
      properties:
        vote:
          $ref: '#/components/schemas/TradeVote'
    TradeReviewRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          description: Open enum.
          type: string
          enum: [approve, veto]
        reason:
          type: string
          maxLength: 280
    # ---------------------------------------------------------------- realtime
    RealtimeTicketRequest:
      type: object
      additionalProperties: false
      properties:
        leagueId:
          description: Subscribe to this league at once. More can be added over the socket.
          $ref: '#/components/schemas/LeagueId'
    RealtimeTicket:
      type: object
      required: [ticket, url, expiresAt]
      properties:
        ticket:
          type: string
        url:
          type: string
          description: The WebSocket URL with the ticket, `wss://.../v1/realtime?ticket=...`.
        expiresAt:
          type: string
          format: date-time
    RealtimeTicketResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RealtimeTicket'
        meta:
          $ref: '#/components/schemas/Meta'
    RealtimeEventType:
      description: Open enum. Clients ignore types they do not know.
      type: string
      enum:
        - draft.updated
        - draft.pick_made
        - matchups.updated
        - score.corrected
        - trade.updated
        - waivers.processed
        - lineup.locked
        - league.updated
        - trade_block.updated
    DraftUpdatedEvent:
      description: Draft status, order, clock or autopick flags changed. Carries the whole draft.
      type: object
      required: [type, leagueId, seq, sentAt, draft]
      properties:
        type:
          type: string
          const: draft.updated
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
          description: Per-league, strictly increasing. A gap means missed events; refetch.
        sentAt:
          type: string
          format: date-time
        draft:
          $ref: '#/components/schemas/Draft'
    DraftPickMadeEvent:
      type: object
      required: [type, leagueId, seq, sentAt, pick, currentPick]
      properties:
        type:
          type: string
          const: draft.pick_made
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        pick:
          $ref: '#/components/schemas/DraftPick'
        currentPick:
          description: The next pick on the clock; null when the draft is complete.
          oneOf:
            - $ref: '#/components/schemas/DraftClock'
            - type: 'null'
    MatchupsUpdatedEvent:
      description: Live scores moved. Sent at most every few seconds per league.
      type: object
      required: [type, leagueId, seq, sentAt, gameweek, scoreState, matchups]
      properties:
        type:
          type: string
          const: matchups.updated
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        scoreState:
          $ref: '#/components/schemas/ScoreState'
        matchups:
          type: array
          items:
            $ref: '#/components/schemas/MatchupSummary'
    ScoreCorrectedEvent:
      description: A late stats correction changed a settled score.
      type: object
      required: [type, leagueId, seq, sentAt, gameweek, team, previousPoints, points]
      properties:
        type:
          type: string
          const: score.corrected
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
        team:
          $ref: '#/components/schemas/TeamRef'
        previousPoints:
          type: integer
        points:
          type: integer
    TradeUpdatedEvent:
      description: Sent to the two teams (and, once accepted, the whole league).
      type: object
      required: [type, leagueId, seq, sentAt, trade]
      properties:
        type:
          type: string
          const: trade.updated
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        trade:
          $ref: '#/components/schemas/Trade'
    WaiversProcessedEvent:
      type: object
      required: [type, leagueId, seq, sentAt, gameweek]
      properties:
        type:
          type: string
          const: waivers.processed
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
    LineupLockedEvent:
      type: object
      required: [type, leagueId, seq, sentAt, gameweek]
      properties:
        type:
          type: string
          const: lineup.locked
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
        gameweek:
          $ref: '#/components/schemas/GameweekNumber'
    LeagueUpdatedEvent:
      description: Settings, members or names changed; refetch the league.
      type: object
      required: [type, leagueId, seq, sentAt]
      properties:
        type:
          type: string
          const: league.updated
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        seq:
          type: integer
        sentAt:
          type: string
          format: date-time
    RealtimeEvent:
      description: |
        A server-to-client WebSocket message (JSON text frame). Discriminated
        on `type`. See docs/realtime.md.
      oneOf:
        - $ref: '#/components/schemas/DraftUpdatedEvent'
        - $ref: '#/components/schemas/DraftPickMadeEvent'
        - $ref: '#/components/schemas/MatchupsUpdatedEvent'
        - $ref: '#/components/schemas/ScoreCorrectedEvent'
        - $ref: '#/components/schemas/TradeUpdatedEvent'
        - $ref: '#/components/schemas/WaiversProcessedEvent'
        - $ref: '#/components/schemas/LineupLockedEvent'
        - $ref: '#/components/schemas/LeagueUpdatedEvent'
        - $ref: '#/components/schemas/TradeBlockUpdatedEvent'
      discriminator:
        propertyName: type
        mapping:
          draft.updated: '#/components/schemas/DraftUpdatedEvent'
          draft.pick_made: '#/components/schemas/DraftPickMadeEvent'
          matchups.updated: '#/components/schemas/MatchupsUpdatedEvent'
          score.corrected: '#/components/schemas/ScoreCorrectedEvent'
          trade.updated: '#/components/schemas/TradeUpdatedEvent'
          waivers.processed: '#/components/schemas/WaiversProcessedEvent'
          lineup.locked: '#/components/schemas/LineupLockedEvent'
          league.updated: '#/components/schemas/LeagueUpdatedEvent'
          trade_block.updated: '#/components/schemas/TradeBlockUpdatedEvent'
    RealtimePong:
      description: |
        The answer to a client `ping`. Not a league event: no `leagueId` or
        `seq`. Browsers cannot see WebSocket pong frames, so the heartbeat
        is a message.
      type: object
      required: [type, serverTime]
      properties:
        type:
          type: string
          const: pong
        serverTime:
          type: string
          format: date-time
    RealtimeServerMessage:
      description: Any server-to-client WebSocket message (JSON text frame).
      oneOf:
        - $ref: '#/components/schemas/RealtimeEvent'
        - $ref: '#/components/schemas/RealtimePong'
    RealtimeSubscribe:
      type: object
      required: [op, leagueId]
      properties:
        op:
          type: string
          const: subscribe
        leagueId:
          $ref: '#/components/schemas/LeagueId'
        afterSeq:
          type: integer
          description: Replay events after this `seq` if the server still has them (5 minutes).
    RealtimeUnsubscribe:
      type: object
      required: [op, leagueId]
      properties:
        op:
          type: string
          const: unsubscribe
        leagueId:
          $ref: '#/components/schemas/LeagueId'
    RealtimePing:
      description: Send every 25 seconds; the server answers with a `RealtimePong` message.
      type: object
      required: [op]
      properties:
        op:
          type: string
          const: ping
    RealtimeClientMessage:
      description: A client-to-server WebSocket message. Discriminated on `op`.
      oneOf:
        - $ref: '#/components/schemas/RealtimeSubscribe'
        - $ref: '#/components/schemas/RealtimeUnsubscribe'
        - $ref: '#/components/schemas/RealtimePing'
      discriminator:
        propertyName: op
        mapping:
          subscribe: '#/components/schemas/RealtimeSubscribe'
          unsubscribe: '#/components/schemas/RealtimeUnsubscribe'
          ping: '#/components/schemas/RealtimePing'
