        caller's leagues plays in it. Players by points, then minutes,
        then name. `owners` lists, for each of the caller's leagues that
        has rosters, the team owning the player in the fixture's gameweek
        (the current one for a postponed fixture); `mine` marks the
        caller's own team. Bonus is provisional until confirmed
        (`bonusProvisional`). `meta.scoreState` is the gameweek's: poll
