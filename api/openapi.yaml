      operationId: makeDraftPick
      tags: [draft]
      summary: Make a pick
      description: |
        Picks a player for the caller's team. 409 `not-your-turn`,
        `player-taken` or `draft-not-live`. 422 `position-full` when the squad
        already has its 2 GKP, 5 DEF, 5 MID or 3 FWD. The commissioner may pick
        for the team on the clock.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPickRequest'
      responses:
        '201':
          description: Picked.
          headers:
            Location:
              description: Path of the created resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPickResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/draft/queue:
    get:
      operationId: getDraftQueue
      tags: [draft]
      summary: The caller's draft queue
      description: |
        Private to the team owner. Autopick takes the first queued player still available at a position the squad needs, else the best available by draft rank.
        After the draft the queue is empty (200, no players), not an error.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQueueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setDraftQueue
      tags: [draft]
      summary: Replace the draft queue
      description: |
        Replaces the whole queue (reorder, add, remove). Players already drafted are dropped from it silently.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftQueueUpdate'
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQueueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/draft/autopick:
    put:
      operationId: setDraftAutopick
      tags: [draft]
      summary: Turn autopick on or off
      description: |
        `enabled`: when on, the caller's picks are made at once from the queue, then by rank.
        `onTimeout`: "autopick when my clock runs out" (on by default). A missed pick clock is
        always autopicked, so the draft never stalls; with `onTimeout` on that also turns
        `enabled` on, with it off the next pick gets a full clock. Either way the pick has
        `missedClock: true` and joins the activity feed (`draft_autopick`).
        A draft whose last pick would land after the deadline of the league's
        last gameweek fails with 409 `season-over` (as do picks and starts).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftAutopickUpdate'
      responses:
        '200':
          description: The queue with the autopick flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftQueueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/teams/{teamId}/lineup:
    get:
      operationId: getLineup
      tags: [lineups]
      summary: A team's lineup for a gameweek
      description: |
        Lineups carry over from the previous gameweek until changed. Before
        the deadline only the owner sees the lineup (403 `lineup-private` for
        anyone else); after the deadline it is locked and visible to the
        league. Once the gameweek has started each entry carries its
        `points`, `autoSub` state and `bonusProvisional`, and the lineup its
        `totalPoints`, `benchPoints` and `scoreState`, so a team page needs
        no matchup request.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
        - name: gameweek
          in: query
          description: Defaults to the next gameweek whose deadline has not passed.
          schema:
            $ref: '#/components/schemas/GameweekNumber'
      responses:
        '200':
          description: The lineup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setLineup
      tags: [lineups]
      summary: Set the XI and bench order (owner)
      description: |
        Owner only. Sets starters (slots 1-11) and the bench (12-15, in
        auto-sub priority order; slot 12 must be the backup goalkeeper) for a
        gameweek and every later gameweek up to the next one with a saved
        lineup (saving replaces only that gameweek's lineup). A carried-over
        lineup that no longer matches the squad is shown repaired: a departed
        player's slot goes to the arrival of his position. No captain. 409
        `lineup-locked` after the gameweek deadline. 422 `invalid-lineup` lists
        every violation in `errors`.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineupUpdate'
      responses:
        '200':
          description: The saved lineup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/config:
