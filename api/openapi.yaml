    delete:
      operationId: cancelWaiverClaim
      tags: [waivers]
      summary: Cancel a pending claim
      description: |
        409 `waivers-processing` once the claim's waiver deadline has passed.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/WaiverClaimIdParam'
      responses:
        '204':
