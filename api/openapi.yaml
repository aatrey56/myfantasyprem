          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/leave:
    post:
      operationId: leaveLeague
      tags: [leagues]
      summary: Leave a league
      description: |
        Before the draft the caller's team is deleted. After it the team stays
        without an owner. The commissioner must hand over the role first
        (`transferCommissioner`; otherwise 409 `commissioner-cannot-leave`).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '204':
          description: Left.
        '400':
