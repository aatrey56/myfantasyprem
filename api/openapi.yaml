openapi: 3.1.0
info:
  title: MyFantasyPrem API
  version: 0.3.0
  summary: Sleeper-style fantasy leagues for the Premier League.
  description: |
    Contract for the MyFantasyPrem API. This file is the single source of
    truth: the Go server stubs (oapi-codegen) and the TypeScript client
    (openapi-typescript + openapi-fetch) are both generated from it. Run
    `npm run gen` after editing and commit the output.

    Leagues, drafts, lineups, waivers and trades live in this app
    (docs/adr/0008). The only outside data is the global player, club,
    fixture and live-stats feed. Scoring applies FPL's official 2026-27
    points rules to those stats. An FPL Draft league already in its season
    can be imported (`/v1/imports*`); it is fully playable here at once,
    and its commissioner can re-sync it from FPL on demand (docs/adr/0012).

    ## Conventions

    - **Auth.** Every operation needs `Authorization: Bearer <accessToken>`
      unless it says `security: []`. Sign in with Apple, Google or an email
      magic link (`/v1/auth/*`) to get a session. A missing, expired or
      revoked token gets 401 with a `WWW-Authenticate: Bearer` header; a
      valid token without the right role (not a member, not the
      commissioner, not the team owner) gets 403.
    - **Envelope.** Every success response with a body is `{ data, meta }`.
      For stats-derived data `meta.dataAsOf` is the last good poll of the
      stats feed while a match is live; between matches, while the poller
      keeps its schedule, it is the server time (nothing upstream moves);
      while the poller fails or has stopped, the last good poll. For league
      state it is the server time.
      `meta.serverTime` is the server clock when the response was built, so
      a client can age `dataAsOf` without trusting its own clock.
      `meta.stale` is true when live data has had no good poll for 3
      minutes, or the poller is failing or 3 minutes past its schedule.
      The server keeps the last good snapshot and never zeroes scores after
      a bad upstream response; clients keep showing the data and surface
      the stale flag.
    - **Score states.** `upcoming` -> `live` -> `provisional` -> `official`
      -> `final`. `live`: matches in progress. `provisional`: all matches
      done, bonus not yet added. `official`: bonus added. `final`: the
      stats feed has checked the data. Results count in the standings from
      `provisional` on, with provisional bonus. A late correction can move
      a score, and the standings with it; it is recomputed from scratch.
    - **Ids.** Every public id is our own opaque string: a type prefix
      (`usr_`, `lg_`, `tm_`, `mu_`, `plr_`, `fx_`, `txn_`, `drf_`, `pk_`,
      `wv_`, `trd_`, `inv_`, `imp_`) and a lowercase ULID. No FPL integer
      is ever a public id. See docs/adr/0006.
    - **Open enums.** Every enum in this document is open: new values can be
      added without a version bump, and clients must tolerate (and render
      neutrally) values they do not know.
    - **Errors.** RFC 9457 `application/problem+json`. The `type` URI's last
      segment is a stable slug clients may branch on (for example
      `lineup-locked`, `not-your-turn`, `player-taken`). 422 bodies list
      every rule violation in `errors`. 5xx details are
      generic; quote `requestId` (also the `X-Request-ID` header) when
      reporting a problem.
    - **Idempotency.** Mutating POSTs accept an `Idempotency-Key` header. A
      retry with the same key and body within 24 hours replays the first
      response; the same key with a different request gets 422
      `idempotency-key-reused`; a retry while the first is still running
      gets 409 `idempotency-key-in-flight`.
    - **Rate limits.** Every request counts against a per-client-IP limit;
      sign-in (`/v1/auth/*`), invite previews and accepts, and realtime
      tickets have tighter per-IP and per-user limits. Over a limit, any
      operation answers 429 `rate-limited` with `Retry-After` (seconds).
    - **Pagination.** Cursor based. Pass `meta.nextCursor` back as `cursor`.
      `nextCursor` is null on the last page.
    - **Realtime.** Live draft picks, scores and trade updates are pushed
      over a WebSocket. Get a short-lived ticket from
      `POST /v1/realtime/tickets`; the event schemas are the
      `Realtime*` components and `x-realtime` below; see docs/realtime.md.
    - **Branding.** Club crests, kit (shirt) images and player photos come
      only from `/v1/assets/*`, and only while the branded-assets switch is
      on (`GET /v1/config` `brandedAssets`; off for App Store and other
      public builds). Off, those operations answer 404 and clients draw
      their generic shirt. Clients never load images from anywhere else.
  license:
    name: UNLICENSED (proprietary, all rights reserved)
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
x-realtime:
  description: |
    WebSocket channel for live updates. Not an HTTP operation, so it is
    described here and in docs/realtime.md rather than under `paths`.
  url: /v1/realtime
  transport: websocket
  auth: 'Query parameter `ticket` from POST /v1/realtime/tickets (single use, 60 s).'
  closeCodes:
    '4400': A message that is not a JSON object with an `op`.
    '4401': The session ended (logout, refresh-token reuse, account deletion) or the socket reached its lifetime cap (the access-token lifetime). Reconnect with a new ticket.
    '4403': Not, or no longer, a member of a subscribed league (left or removed).
    '1013': The client fell behind.
    '1001': The server is shutting down.
  serverMessages:
    $ref: '#/components/schemas/RealtimeServerMessage'
  clientMessages:
    $ref: '#/components/schemas/RealtimeClientMessage'
tags:
  - name: system
  - name: auth
  - name: me
  - name: leagues
  - name: invites
  - name: draft
  - name: lineups
  - name: players
  - name: waivers
  - name: trades
  - name: realtime
  - name: gameweeks
  - name: assets
    description: Club crests, shirts and player photos behind the branded-assets switch.
  - name: imports
    description: Importing an FPL Draft league, re-syncing it on demand and checking it against FPL (docs/adr/0012).
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      summary: Liveness probe
      description: |
        Not versioned and not wrapped in the `{data, meta}` envelope. With a
        database, it is pinged (short timeout): 503 `unavailable` when it
        does not answer.
      responses:
        '200':
          description: The process is up (and its database answers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database does not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/imports:
    post:
      operationId: createImport
      tags: [imports]
      summary: Import an FPL Draft league
      description: |
        Starts an asynchronous import from a draft.premierleague.com league
        link or the numeric FPL Draft league id, with `seat` the caller's
        own team (as numbered in the preview). Needs no FPL login: only
        FPL Draft's public league endpoints are read, by the server. The
        caller becomes the league's commissioner and owner of that seat;
        every other seat gets a claim link (`GET
        /v1/leagues/{leagueId}/seats`). The league is playable here at
        once, like a native one; nothing syncs automatically. The
        commissioner may re-sync it from FPL (`POST
        /v1/leagues/{leagueId}/sync`).

        Idempotent per caller and FPL league: if the caller's import of the
        same league is `queued`, `running` or `succeeded`, that import is
        returned with 200 instead of starting a new one. A `failed` import
        does not block a new attempt. Another user importing the same FPL
        league gets a league of their own.

        422 `unsupported-league` for a classic-scoring league,
        `draft-not-complete` before FPL's draft has finished, and
        `invalid-request` for a seat out of range. 404 when FPL has no
        such league; 502 when FPL cannot be reached.
        409 `import-unavailable` when this server's player data does not
        come from FPL (a demo server): no FPL league can be imported here.

        Classic FPL links (fantasy.premierleague.com) are rejected with 422
        and problem type `.../problems/classic-league-url`: draft and classic
        league ids overlap, so importing one by mistake would mirror the
        wrong league.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: The caller's import of this FPL league is already active or has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '202':
          description: The import was queued. Poll `Location` no sooner than `Retry-After`.
          headers:
            Location:
              description: Path of the import resource, `/v1/imports/{importId}`.
              required: true
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before polling.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/preview:
    get:
      operationId: previewImport
      tags: [imports]
      summary: Look up a league before importing it
      description: |
        Returns the league name, its teams (seats), FPL's current gameweek
        and whether it can be imported, so the user can confirm "Is this
        your league?" and pick their own team before calling `POST
        /v1/imports`. One request to FPL.
        Pass exactly one of `draftLeagueUrl` or `fplLeagueId`. Classic links
        are rejected as in `POST /v1/imports`.
      parameters:
        - name: draftLeagueUrl
          in: query
          description: A draft.premierleague.com league link.
          schema:
            $ref: '#/components/schemas/DraftLeagueUrl'
        - name: fplLeagueId
          in: query
          schema:
            $ref: '#/components/schemas/FplLeagueId'
      responses:
        '200':
          description: The league as FPL describes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{importId}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Import job status
      description: The caller's own imports only.
      parameters:
        - $ref: '#/components/parameters/ImportIdParam'
      responses:
        '200':
          description: The import. Poll while `status` is `queued` or `running`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: League home
      description: |
        Settings, standings, the current gameweek and its matchups. Standings
        never include the league-average pseudo-team.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      responses:
        '200':
          description: League home.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueHomeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Change league settings (commissioner)
      description: |
        Commissioner only. Some settings lock once the draft starts
        (`teamCount`, `roster`, `lineup`, `draft.type`, `trades.review`) and
        answer 409 `setting-locked` after that. `waivers.order` can change
        at any time and applies from the next waiver run (`nextRunGameweek`
        and `nextRunAt` in `GET /v1/leagues/{leagueId}/waivers`); while a
        run is due (its deadline passed, not yet processed) it answers 409
        `waivers-processing`. A switch to `rolling` starts from the order the
        next run would have used.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueUpdate'
      responses:
        '200':
          description: The updated league.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/gameweeks/{gw}/matchups:
    get:
      operationId: listMatchups
      tags: [leagues]
      summary: Scoreboard for one gameweek
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/GameweekParam'
      responses:
        '200':
          description: All matchups in the gameweek.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchupListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/gameweeks/{gw}/matchups/{matchupId}:
    get:
      operationId: getMatchup
      tags: [leagues]
      summary: Live matchup
      description: |
        Both sides of a head-to-head. A real team has starters (slots 1-11)
        and bench (12-15), per-player points, per-fixture status, minutes,
        points breakdown, projected auto-subs and totals. In a league with an
        odd number of teams one side is the league average, which has a score
        but no lineup.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/GameweekParam'
        - $ref: '#/components/parameters/MatchupIdParam'
      responses:
        '200':
          description: Matchup detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchupDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/gameweeks/{gw}/matchups/{matchupId}/preview:
    get:
      operationId: getMatchupPreview
      tags: [leagues]
      summary: Matchup preview (any gameweek, no scores)
      description: |
        A scheduled matchup's pairing with each side's squad as it stands:
        the viewer's own team in the lineup set for that gameweek, every
        other team in its latest locked lineup (lineups stay private until
        their deadline), both on the current roster. Each player lists his
        fixtures in that gameweek with kickoffs as currently scheduled. No
        points and no projections. The league-average side has no lineup.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/GameweekParam'
        - $ref: '#/components/parameters/MatchupIdParam'
      responses:
        '200':
          description: Matchup preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchupPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/teams/{teamId}:
    get:
      operationId: getTeam
      tags: [leagues]
      summary: Team page
      description: Roster, record, results and the next opponent.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '200':
          description: Team detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTeam
      tags: [leagues]
      summary: Rename a team (owner)
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRefResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/players:
    get:
      operationId: listLeaguePlayers
      tags: [players]
      summary: Players in the context of a league
      description: |
        Every player with their roster status in this league: on a team, on
        waivers (recently dropped, or every unowned player between the
        gameweek deadline and the next waiver run) or a free agent. Used
        for the Players tab, free agents, the waiver wire and the draft
        room (`status=available&sort=draft_rank`).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - name: status
          in: query
          description: |
            Filter by roster status. `available` is `free_agent` plus
            `waivers` and `locked` (anyone unowned).
          schema:
            type: string
            enum: [all, available, free_agent, waivers, rostered, locked]
            default: all
        - name: available
          in: query
          deprecated: true
          description: Deprecated alias of `status=available`.
          schema:
            type: boolean
            default: false
        - name: position
          in: query
          schema:
            $ref: '#/components/schemas/Position'
        - name: club
          in: query
          description: Club code, as in `GET /v1/clubs`.
          schema:
            type: string
            minLength: 2
            maxLength: 4
        - name: teamId
          in: query
          description: Only players on this team.
          schema:
            $ref: '#/components/schemas/TeamId'
        - name: q
          in: query
          description: Case-insensitive name search.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: watchlist
          in: query
          description: Only players on the caller's watchlist in this league.
          schema:
            type: boolean
            default: false
        - name: tag
          in: query
          description: Only players the caller tagged with this tag in this league.
          schema:
            $ref: '#/components/schemas/PlayerTag'
        - name: sort
          in: query
          description: |
            Open enum. Season totals unless named otherwise:
            `gameweek_points` is the current gameweek's; `form` is the mean
            points over the last two completed gameweeks (see
            `PlayerListItem.form`); `points_per_match` is total points over
            matches played (`PlayerListItem.seasonStats` counts, one
            decimal). `form_rise` and `form_fall` order by
            `PlayerListItem.formChange`, biggest rise or biggest fall first.
            `draft_rank` is the pre-draft ranking (1 = best) that autopick
            also uses. Goals, assists, clean sheets (60+ minutes), goals
            conceded, own goals, penalties, cards, saves, bonus and minutes
            come from the scored matches; `bps`, `starts`, the ICT and
            expected stats, `clearances_blocks_interceptions`, `recoveries`,
            `tackles` and `defensive_contribution` (CBIT or CBIRT, as the
            position counts it) from the source's per-match stats.
            `PlayerListItem.sortValue` carries the sorted value. Ties go by
            total points (most first), then name (A to Z). A null value
            (stat untracked for the player) sorts last in either order.
          schema:
            type: string
            enum:
              [
                total_points,
                gameweek_points,
                form,
                form_rise,
                form_fall,
                points_per_match,
                draft_rank,
                name,
                goals,
                assists,
                bonus,
                bps,
                clean_sheets,
                creativity,
                goals_conceded,
                ict_index,
                influence,
                minutes,
                own_goals,
                penalties_missed,
                penalties_saved,
                red_cards,
                saves,
                threat,
                yellow_cards,
                starts,
                expected_goals,
                expected_assists,
                expected_goal_involvements,
                expected_goals_conceded,
                clearances_blocks_interceptions,
                recoveries,
                tackles,
                defensive_contribution,
              ]
            default: total_points
        - name: order
          in: query
          description: |
            `desc` (default) puts the biggest value first; `asc` the
            smallest. For `draft_rank` and `name` `desc` is the natural
            order (rank 1 first, A to Z) and `asc` reverses it; for
            `form_fall` `desc` is the biggest fall first. Nulls sort last
            either way.
          schema:
            type: string
            enum: [desc, asc]
            default: desc
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of players.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/players/{playerId}:
    get:
      operationId: getLeaguePlayer
      tags: [players]
      summary: Player sheet
      description: |
