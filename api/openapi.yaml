      tags: [imports]
      summary: Check against FPL (commissioner)
      description: |
        Queues a check: FPL Draft is fetched and the league is compared
        with it (scores, results, standings, squads, ownership, waiver
        order) without changing anything. The report is informational:
        after moves made here the league differs from FPL by design. 409
        `sync-pending` while a re-sync or check is queued or running.
      parameters:
