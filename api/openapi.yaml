  # ------------------------------------------------ projections (ADR 0014)
  /v1/fixture-difficulty:
    get:
      operationId: getFixtureDifficulty
      tags: [gameweeks]
      summary: Fixture difficulty by position
      description: |
        Every club ranked, per position, by the points it conceded to that
        position over the last six completed gameweeks before the form
        gameweek (`recentGameweeks`), per match so double and blank
        gameweeks compare fairly. Rank 1 conceded least (hardest opponent),
        20 most (easiest). Clubs conceding the same per match share the
        better rank. A club with no match in the window is left out. The
        app colours a fixture by its opponent's rank for the player's
        position. Empty `positions[].clubs` before any gameweek is
        completed.
      responses:
        '200':
          description: The rankings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureDifficultyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
