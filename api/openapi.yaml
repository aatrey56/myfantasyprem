          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMe
      tags: [me]
      summary: Delete the account
      description: |
        Deletes the account and its personal data (including unused sign-in
        links), revokes every session and open realtime socket, and revokes
        the Apple refresh token obtained from the authorization code at Apple
        sign-in (App Store guideline 5.1.1(v)). Leaving the leagues and
        deleting the account commit together. The user leaves
        every league: in a league that has not drafted the team is removed; in
        a league that has drafted, the team stays (so schedules and standings
        still work) as an open seat: no owner and `managerName` "Open seat";
        the next person to join with an invite takes it over. A sole commissioner's role
        passes to the longest-standing member.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
