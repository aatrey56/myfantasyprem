    get:
      operationId: getLeagueSync
      tags: [imports]
      summary: An imported league's FPL status
      description: |
        Members see when FPL's state was last applied (the import or the
        last re-sync), a re-sync or check that is queued or running, and
        the last re-sync's notice (moves it cancelled). The commissioner
        also gets the latest check against FPL. 409 `not-imported` for a
        league created here.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      responses:
        '200':
          description: The league's FPL status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: resyncLeague
      tags: [imports]
      summary: Re-sync from FPL (commissioner)
      description: |
        Queues a re-sync: FPL Draft is fetched again and the league's
        squads, player ownership, waiver order, activity feed, trades and
        lineups are reset to FPL's current state (team names and settings
        too); scores, results and standings are recomputed. Every move made
        here since `lastSyncedAt` is replaced. Open trades fail
        (`league_resynced`) and pending waiver claims are cancelled; the
        sync's `note` says how many. Claimed teams stay claimed. Re-syncing
        twice in a row changes nothing more. `confirm` must be true. 409
        `sync-pending` while a re-sync or check is queued or running; 409
        `resync-disabled` when the operator turned re-sync off for this
        league (FPL_RESYNC_DISABLED_LEAGUES).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncInput'
      responses:
        '202':
          description: The re-sync is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
