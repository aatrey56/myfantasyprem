    get:
      operationId: getNotificationPreferences
      tags: [me]
      summary: Push notification settings
      description: |
        The caller's push settings in each of their leagues, one switch per
        notification type. Every type is on until the user turns it off.
        `types` lists the types this server knows, with their group, in the
        order to show them.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
