        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/waivers/claim-order:
    put:
      operationId: reorderWaiverClaims
      tags: [waivers]
      summary: Reorder pending claims
      description: |
        The ids of every pending claim of the caller's team, in the new order (422 if the set differs).
        409 `waivers-processing` while a claim's waiver deadline has passed and its run is due.
