  /v1/me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [me]
      summary: Mark notifications read
      description: |
        Marks the listed notifications read, or every one when `all` is
        true. Unknown or someone else's ids are ignored. Idempotent.
