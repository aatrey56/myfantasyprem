          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationPreferences
      tags: [me]
      summary: Change push notification settings
      description: |
        Applies `all` first (true: All on, false: All off), then each entry
        of `settings`, to one league (`leagueId`) or, without it, to every
        league the caller is in. Unknown types are 422. Returns the new
        settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
      responses:
        '200':
          description: The new settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
