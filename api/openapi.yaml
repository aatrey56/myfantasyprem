  /v1/me/notifications:
    get:
      operationId: listNotifications
      tags: [me]
      summary: The caller's notification inbox
      description: |
        Every notification for the caller, newest first, read and unread,
        across their leagues (the FEED tab). Every notification lands here
        whatever the push settings; preferences only decide push. Up to
        `limit` items (default 50); older ones are kept for 30 days.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: unread
          in: query
          required: false
          description: Only unread items.
