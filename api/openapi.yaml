  /v1/leagues/{leagueId}/waivers:
    get:
      operationId: getWaivers
      tags: [waivers]
      summary: Waiver order and next run
      description: |
        The order the next run starts from (`priority`) under the league's
        rule (`order`, see `WaiverOrderRule`). Waivers run once per gameweek, 24
        hours before the deadline, processing claims in priority order with
        each team's claims in its own order; a team that wins a claim moves
        to the back for the rest of the run.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
      responses:
        '200':
          description: The waiver state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/waivers/claims:
    get:
      operationId: listWaiverClaims
      tags: [waivers]
      summary: The caller's waiver claims
      description: |
        Private to the team: other teams never see pending claims. Processed
        claims from every team appear in `/transactions`.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - name: status
          in: query
          description: '`pending` (default) or `processed` (won and lost, newest first).'
          schema:
            type: string
            enum: [pending, processed]
            default: pending
      responses:
        '200':
          description: Claims in priority order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverClaimListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWaiverClaim
      tags: [waivers]
      summary: Claim a player on waivers
      description: |
        Adds a claim at the end of the caller's list. A claim made after a
        gameweek's waiver deadline joins the next run (`gameweek`), even
        before that gameweek's run has happened. The dropped player must
        play the same position, so the squad stays 2/5/5/3 (422
        `position-mismatch`). 409 `player-not-on-waivers` for a free agent
        (add them with `/free-agent-moves`) or a rostered player,
        `duplicate-claim`, `player-locked` (the drop was added since the last
        run) and `player-in-trade` (the drop is in a trade that counts from
        the next gameweek).
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiverClaimCreate'
      responses:
        '201':
          description: Claim added.
          headers:
            Location:
              description: Path of the created resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /v1/leagues/{leagueId}/waivers/claims/{claimId}:
    patch:
      operationId: updateWaiverClaim
      tags: [waivers]
      summary: Change the player a claim drops
      description: |
        Same checks on the new drop as creating a claim (`position-mismatch`,
        `player-locked`, `player-in-trade`). 409 `waivers-processing` once the
        claim's waiver deadline has passed.
      parameters:
        - $ref: '#/components/parameters/LeagueIdParam'
        - $ref: '#/components/parameters/WaiverClaimIdParam'
      requestBody:
