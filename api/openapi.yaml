      description: |
        Awards for one gameweek, from every Premier League player in the
        game, owned or not. Player of the Week has the most points; ties go
        to more goals, then more assists, bonus, BPS, defensive
        contribution and clean sheets, then fewer minutes. Team of the Week
        is exactly 11: one goalkeeper, 3-5 defenders, 2-5 midfielders and
        1-3 forwards. It takes the best goalkeeper, three defenders, two
        midfielders and one forward, then the four best remaining outfield
