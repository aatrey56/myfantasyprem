name: deploy

# Builds the API image (linux/arm64 + amd64) to GHCR and publishes the web
# app to Cloudflare Pages. Off until the repository variable
# DEPLOY_ENABLED is "true" (Settings > Secrets and variables > Actions >
# Variables). docs/DEPLOY.md lists every secret and variable.
#
# The VM pulls the image itself: on the VM, `deploy/deploy.sh deploy <tag>`.
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
# Variables: DEPLOY_ENABLED, API_BASE_URL (https://api.example.com),
#            PAGES_PROJECT (the Cloudflare Pages project name)

on:
  workflow_dispatch:
    inputs:
      web:
        description: Publish the web app to Cloudflare Pages
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: |
          echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myfantasyprem-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          {
            echo "### API image"
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "On the VM: \`deploy/deploy.sh deploy ${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build web (production) with Pages headers
        run: npm run build:web:pages
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/app/dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main --commit-dirty=true
